<script>
/* KaraokeAudio v4 — robust pitch engine
 * Implements McLeod Pitch Method (NSDF) inline + octave correction + median filter
 * + per-note scoring + user-range estimation. Pure vanilla browser. No imports.
 */
(function (global) {
  'use strict';

  var ctx = null;
  var ana = null;
  var BUF = 2048;
  var buf = null;
  var freqBuf = null;
  var freqHist = [];
  var medianWin = [];
  var note = null;
  var rangeStartT = 0;
  var rangeFreqs = [];
  var rangeDoneAt = 0;
  var lastRMS = 0;
  var lastCentroid = 0;
  var lastFlatness = 0;
  var _lastDetection = null;

  function init(audioCtx, analyserNode, bufSize) {
    ctx = audioCtx;
    ana = analyserNode;
    BUF = bufSize || 2048;
    buf = new Float32Array(BUF);
    freqBuf = new Float32Array(ana ? ana.frequencyBinCount : BUF / 2);
    resetSession();
    rangeStartT = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    rangeDoneAt = 0;
    rangeFreqs = [];
  }

  function resetSession() {
    freqHist = [];
    medianWin = [];
    note = null;
  }

  function nsdf(x) {
    var n = x.length;
    var half = n >> 1;
    var out = new Float32Array(half);
    for (var t = 0; t < half; t++) {
      var ac = 0, m = 0;
      for (var j = 0; j < n - t; j++) {
        var a = x[j], b = x[j + t];
        ac += a * b;
        m += a * a + b * b;
      }
      out[t] = m > 0 ? (2 * ac) / m : 0;
    }
    return out;
  }

  function pickPeak(ns) {
    var n = ns.length;
    var i = 1;
    while (i < n - 1 && ns[i] > 0) i++;
    while (i < n - 1 && ns[i] <= 0) i++;
    if (i >= n - 1) return -1;
    var peakIdx = -1, peakVal = -1;
    for (; i < n - 1; i++) {
      if (ns[i] > ns[i - 1] && ns[i] >= ns[i + 1] && ns[i] > peakVal) {
        peakVal = ns[i];
        peakIdx = i;
      }
    }
    return peakIdx;
  }

  function parabolic(a, k) {
    if (k <= 0 || k >= a.length - 1) return { x: k, y: a[k] };
    var l = a[k - 1], c = a[k], r = a[k + 1];
    var denom = (l - 2 * c + r);
    var dx = denom !== 0 ? 0.5 * (l - r) / denom : 0;
    if (!isFinite(dx) || dx > 1 || dx < -1) dx = 0;
    var y = c - 0.25 * (l - r) * dx;
    return { x: k + dx, y: y };
  }

  function computeRMS(x) {
    var s = 0;
    for (var i = 0; i < x.length; i++) s += x[i] * x[i];
    return Math.sqrt(s / x.length);
  }

  function computeFlatnessAndCentroid() {
    if (!ana || !freqBuf) return { flat: 0, cent: 0 };
    ana.getFloatFrequencyData(freqBuf);
    var n = freqBuf.length;
    var mags = new Float32Array(n);
    var sumMag = 0, logSum = 0, valid = 0;
    var sr = ctx ? ctx.sampleRate : 44100;
    var binHz = sr / 2 / n;
    var weighted = 0;
    for (var i = 1; i < n; i++) {
      var db = freqBuf[i];
      if (db < -120) db = -120;
      var lin = Math.pow(10, db / 20);
      mags[i] = lin;
      sumMag += lin;
      weighted += lin * (i * binHz);
      if (lin > 1e-10) { logSum += Math.log(lin); valid++; }
    }
    var flat = 0;
    if (valid > 0 && sumMag > 0) {
      var geo = Math.exp(logSum / valid);
      var arith = sumMag / (n - 1);
      flat = arith > 0 ? geo / arith : 0;
    }
    var cent = sumMag > 0 ? weighted / sumMag : 0;
    return { flat: flat, cent: cent };
  }

  function trimHist(now) {
    var cutoff = now - 200;
    while (freqHist.length && freqHist[0].t < cutoff) freqHist.shift();
  }

  function octaveCorrect(f, now) {
    trimHist(now);
    if (!freqHist.length) return f;
    var s = 0;
    for (var i = 0; i < freqHist.length; i++) s += Math.log(freqHist[i].f);
    var mean = Math.exp(s / freqHist.length);
    var d0 = Math.abs(1200 * Math.log2(f / mean));
    if (d0 <= 600) return f;
    var fUp = f * 2, fDn = f / 2;
    var dUp = Math.abs(1200 * Math.log2(fUp / mean));
    var dDn = Math.abs(1200 * Math.log2(fDn / mean));
    var best = f, bd = d0;
    if (dUp < bd) { best = fUp; bd = dUp; }
    if (dDn < bd) { best = fDn; bd = dDn; }
    return best;
  }

  function medianFilter(f) {
    medianWin.push(f);
    if (medianWin.length > 5) medianWin.shift();
    var sorted = medianWin.slice().sort(function (a, b) { return a - b; });
    return sorted[Math.floor(sorted.length / 2)];
  }

  function detectPitch() {
    if (!ctx || !ana || !buf) { _lastDetection = null; return null; }
    ana.getFloatTimeDomainData(buf);
    var sm = computeFlatnessAndCentroid();
    lastFlatness = sm.flat;
    lastCentroid = sm.cent;
    var rms = computeRMS(buf);
    lastRMS = rms;
    var voiced = (rms > 0.018) && (sm.flat < 0.5);
    if (!voiced) { _lastDetection = null; return null; }
    var ns = nsdf(buf);
    var k = pickPeak(ns);
    if (k < 2) { _lastDetection = null; return null; }
    var clarity = ns[k];
    if (clarity < 0.85) { _lastDetection = { freq: 0, clarity: clarity, voiced: false }; return null; }
    var refined = parabolic(ns, k);
    var lag = refined.x;
    if (lag <= 0) { _lastDetection = null; return null; }
    var freq = ctx.sampleRate / lag;
    if (freq < 80 || freq > 1000) { _lastDetection = null; return null; }
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var fc = octaveCorrect(freq, now);
    var fm = medianFilter(fc);
    freqHist.push({ t: now, f: fm });
    if (rangeDoneAt === 0) {
      if (now - rangeStartT <= 5000) { rangeFreqs.push(fm); }
      else { rangeDoneAt = now; }
    }
    if (note && note.target) {
      var cents = 1200 * Math.log2(fm / note.target);
      note.voiced++;
      note.centsSum += cents;
      note.framesAbs += Math.abs(cents);
    }
    if (note) note.total++;
    var _out = { freq: fm, clarity: clarity, voiced: true };
    _lastDetection = _out;
    return _out;
  }

  function startNote(targetFreq, noteId) {
    note = { target: targetFreq, id: noteId, voiced: 0, total: 0, centsSum: 0, framesAbs: 0 };
  }

  function endNote() {
    if (!note) return { avgCents: 0, hitFrames: 0, totalFrames: 0, grade: 'MISS' };
    var avgCents = note.voiced > 0 ? (note.centsSum / note.voiced) : 9999;
    var abs = Math.abs(avgCents);
    var grade;
    if (note.voiced === 0) grade = 'MISS';
    else if (abs < 25) grade = 'PERFECT';
    else if (abs < 50) grade = 'GREAT';
    else if (abs < 100) grade = 'GOOD';
    else grade = 'MISS';
    var result = { avgCents: avgCents, hitFrames: note.voiced, totalFrames: note.total, grade: grade };
    note = null;
    return result;
  }

  function estimateUserRange() {
    if (rangeFreqs.length < 5) return { meanFreq: 0, suggestedKeyShift: 0 };
    var s = 0;
    for (var i = 0; i < rangeFreqs.length; i++) s += Math.log(rangeFreqs[i]);
    var meanFreq = Math.exp(s / rangeFreqs.length);
    var anchor = 220;
    var semis = 12 * Math.log2(meanFreq / anchor);
    var candidates = [-5, -3, -2, 0, 2, 3, 5];
    var best = 0, bd = 1e9;
    for (var j = 0; j < candidates.length; j++) {
      var d = Math.abs(candidates[j] - (-semis));
      if (d < bd) { bd = d; best = candidates[j]; }
    }
    return { meanFreq: meanFreq, suggestedKeyShift: best };
  }

  function getRMS() { return lastRMS; }
  function getSpectralCentroid() { return lastCentroid; }

  global.KaraokeAudio = {
    init: init,
    detectPitch: detectPitch,
    resetSession: resetSession,
    startNote: startNote,
    endNote: endNote,
    estimateUserRange: estimateUserRange,
    getRMS: getRMS,
    getSpectralCentroid: getSpectralCentroid,
    getLastDetection: function () { return _lastDetection; }
  };
})(typeof window !== 'undefined' ? window : this);
</script>

<script>
/* KaraokeShader v4 — WebGL2 fluid k-pop background */
(function () {
  'use strict';

  const VERT_SRC = `#version 300 es
  precision highp float;
  out vec2 vUV;
  void main() {
    vec2 p = vec2((gl_VertexID & 1) * 2 - 1, (gl_VertexID & 2) - 1);
    vUV = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
  }`;

  const FRAG_SRC = `#version 300 es
  precision highp float;
  in vec2 vUV;
  out vec4 fragColor;
  uniform vec2  uResolution;
  uniform float uTime;
  uniform float uRMS;
  uniform float uCentroid;
  uniform float uBeat;
  uniform float uCombo;
  uniform int   uMode;
  uniform float uPerfectStart;
  const vec3 PURPLE = vec3(0.659, 0.333, 0.969);
  const vec3 PINK   = vec3(1.000, 0.416, 0.690);
  const vec3 GOLD   = vec3(1.000, 0.843, 0.000);
  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0; float a = 0.5;
    mat2 R = mat2(0.8, -0.6, 0.6, 0.8);
    for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = R * p * 2.03 + 11.7; a *= 0.5; }
    return v;
  }
  float warpedFbm(vec2 p, float t, float warpAmt) {
    vec2 q = vec2(fbm(p + vec2(0.0, t * 0.20)), fbm(p + vec2(5.2, 1.3) + t * 0.17));
    vec2 r = vec2(fbm(p + warpAmt * q + vec2(1.7, 9.2) + t * 0.15), fbm(p + warpAmt * q + vec2(8.3, 2.8) + t * 0.13));
    return fbm(p + warpAmt * r);
  }
  vec3 palette(float x) {
    x = clamp(x, 0.0, 1.0);
    vec3 c = mix(PURPLE, PINK, smoothstep(0.0, 0.55, x));
    c = mix(c, GOLD, smoothstep(0.55, 1.0, x));
    return c;
  }
  float dither(vec2 frag) { return (hash21(frag) - 0.5) / 255.0; }
  void main() {
    vec2 uv = vUV;
    vec2 p = (uv * 2.0 - 1.0);
    p.x *= uResolution.x / uResolution.y;
    float t = uTime;
    float speed = 0.35 + 0.85 * uCombo + 0.55 * uRMS;
    float warpAmt = 1.4 + 1.6 * uCombo + 0.6 * uRMS;
    vec2 base = p * (1.05 + 0.25 * sin(t * 0.07));
    base += 0.15 * vec2(sin(t * 0.11), cos(t * 0.09));
    float n = warpedFbm(base * 1.4, t * speed, warpAmt);
    float zone = fbm(base * 0.6 + vec2(0.0, t * 0.05));
    float axis = clamp(n * 0.7 + zone * 0.45 + uCentroid * 0.25, 0.0, 1.0);
    vec3 col = palette(axis);
    float curtain = smoothstep(0.0, 0.85, 0.85 - abs(uv.y - 0.5) * 0.9);
    col *= 0.55 + 0.55 * curtain;
    float pulse = 1.0 + 0.55 * uRMS + 0.18 * sin(t * 6.2 + uRMS * 8.0);
    col *= pulse;
    col = mix(col, col * vec3(1.05, 0.98, 0.85), uCentroid * 0.4);
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col = mix(vec3(lum), col, 0.85 + 0.6 * uCombo);
    float r = length(p);
    float beatRing = exp(-pow(r * (3.0 - 1.5 * uBeat), 2.0)) * uBeat;
    col += beatRing * vec3(1.2, 1.0, 0.85) * 0.85;
    if (uMode == 1) { float rim = smoothstep(0.7, 1.4, r); col += rim * GOLD * 0.18 * (0.5 + 0.5 * uRMS); }
    if (uMode == 2 && uPerfectStart >= 0.0) {
      float dt = max(0.0, uTime - uPerfectStart);
      float k = exp(-dt / 0.10) * smoothstep(0.30, 0.0, dt);
      col = mix(col, GOLD * 1.6, clamp(k, 0.0, 1.0));
    }
    if (uMode == 3) { col = col * 0.85 + GOLD * 0.07; }
    float vig = smoothstep(1.55, 0.35, r);
    col *= mix(0.65, 1.0, vig);
    col = col / (col + 0.85);
    col = pow(col, vec3(0.92));
    col += dither(gl_FragCoord.xy);
    fragColor = vec4(col, 1.0);
  }`;

  const state = {
    canvas: null, gl: null, program: null, vao: null, uniforms: {},
    dpr: 1, width: 0, height: 0, rms: 0, centroid: 0.5, beat: 0, combo: 0,
    mode: 0, perfectStart: -1, lastBeatPulse: 0, startTime: 0, ready: false,
  };

  function compile(gl, type, src) {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { gl.deleteShader(sh); return null; }
    return sh;
  }

  function link(gl, vs, fs) {
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { gl.deleteProgram(p); return null; }
    return p;
  }

  function init(canvasElement) {
    if (!canvasElement) return false;
    const gl = canvasElement.getContext('webgl2', {
      alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance',
    });
    if (!gl) return false;
    const vs = compile(gl, gl.VERTEX_SHADER, VERT_SRC);
    const fs = compile(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
    if (!vs || !fs) return false;
    const program = link(gl, vs, fs);
    gl.deleteShader(vs); gl.deleteShader(fs);
    if (!program) return false;
    const vao = gl.createVertexArray();
    state.canvas = canvasElement; state.gl = gl; state.program = program; state.vao = vao;
    state.uniforms = {
      uResolution: gl.getUniformLocation(program, 'uResolution'),
      uTime: gl.getUniformLocation(program, 'uTime'),
      uRMS: gl.getUniformLocation(program, 'uRMS'),
      uCentroid: gl.getUniformLocation(program, 'uCentroid'),
      uBeat: gl.getUniformLocation(program, 'uBeat'),
      uCombo: gl.getUniformLocation(program, 'uCombo'),
      uMode: gl.getUniformLocation(program, 'uMode'),
      uPerfectStart: gl.getUniformLocation(program, 'uPerfectStart'),
    };
    state.startTime = performance.now() / 1000;
    state.ready = true;
    resize();
    return true;
  }

  function resize() {
    if (!state.canvas || !state.gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = state.canvas.clientWidth || window.innerWidth;
    const cssH = state.canvas.clientHeight || window.innerHeight;
    const w = Math.max(1, Math.floor(cssW * dpr));
    const h = Math.max(1, Math.floor(cssH * dpr));
    if (state.width !== w || state.height !== h) { state.canvas.width = w; state.canvas.height = h; state.width = w; state.height = h; }
    state.dpr = dpr; state.gl.viewport(0, 0, w, h);
  }

  function setAudio(rms, centroid, beat) {
    if (typeof rms === 'number') state.rms = Math.min(1, Math.max(0, rms));
    if (typeof centroid === 'number') state.centroid = Math.min(1, Math.max(0, centroid));
    if (typeof beat === 'number') { const b = Math.min(1, Math.max(0, beat)); state.beat = Math.max(state.beat * 0.86, b); }
  }
  function setCombo(comboLevel) { const c = typeof comboLevel === 'number' ? comboLevel : 0; state.combo = Math.min(1, c / 30); }
  function setMode(mode) {
    const map = { idle: 0, singing: 1, perfect: 2, result: 3 };
    const m = typeof mode === 'string' ? (map[mode] ?? 0) : (mode | 0);
    if (m === 2 && state.mode !== 2) state.perfectStart = (performance.now() / 1000) - state.startTime;
    state.mode = m;
  }
  function render(time) {
    if (!state.ready) return;
    const gl = state.gl;
    state.beat *= 0.90; if (state.beat < 0.002) state.beat = 0;
    const t = (typeof time === 'number') ? (time / 1000) - state.startTime : (performance.now() / 1000) - state.startTime;
    gl.useProgram(state.program); gl.bindVertexArray(state.vao);
    gl.uniform2f(state.uniforms.uResolution, state.width, state.height);
    gl.uniform1f(state.uniforms.uTime, t);
    gl.uniform1f(state.uniforms.uRMS, state.rms);
    gl.uniform1f(state.uniforms.uCentroid, state.centroid);
    gl.uniform1f(state.uniforms.uBeat, state.beat);
    gl.uniform1f(state.uniforms.uCombo, state.combo);
    gl.uniform1i(state.uniforms.uMode, state.mode);
    gl.uniform1f(state.uniforms.uPerfectStart, state.perfectStart);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  function destroy() {
