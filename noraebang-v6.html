<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>StarVoice v6 - 노래방</title>
<style>
/* ===== CSS Variables for Dark/Light theme ===== */
:root{
--bg-primary:#0a0818;--bg-secondary:#1a1040;--bg-tertiary:#2a1060;
--text-primary:#eee;--text-secondary:#aaa;--text-muted:#888;
--accent:#ff6ab0;--accent2:#a855f7;--accent-gold:#ffd700;
--card-bg:linear-gradient(135deg,rgba(40,20,80,.8),rgba(60,30,100,.6));
--card-border:rgba(255,106,176,.15);--card-hover:#ff6ab0;
--header-bg:linear-gradient(135deg,#1a1040,#2a1060);--header-border:#6a3aaa;
--lyrics-bg:linear-gradient(180deg,rgba(30,15,60,.95),rgba(20,10,40,.98));
--modal-bg:rgba(0,0,0,.85);--modal-box-bg:linear-gradient(135deg,#1a1040,#2a1060);
--scrollbar:#555;--pitch-bg:linear-gradient(180deg,#0a0818,#15102a);
--search-bg:rgba(255,255,255,.08);--search-border:rgba(255,255,255,.15);
--btn-bg:rgba(255,255,255,.1);--btn-border:rgba(255,255,255,.2);
}
[data-theme="light"]{
--bg-primary:#f0f0f5;--bg-secondary:#e8e0f0;--bg-tertiary:#d8d0e8;
--text-primary:#222;--text-secondary:#666;--text-muted:#999;
--accent:#d4408a;--accent2:#7c3aed;--accent-gold:#b8860b;
--card-bg:linear-gradient(135deg,rgba(230,220,245,.9),rgba(240,230,250,.85));
--card-border:rgba(124,58,237,.2);--card-hover:#d4408a;
--header-bg:linear-gradient(135deg,#e8e0f0,#d8d0e8);--header-border:#a888dd;
--lyrics-bg:linear-gradient(180deg,rgba(230,220,245,.97),rgba(240,230,250,.98));
--modal-bg:rgba(255,255,255,.9);--modal-box-bg:linear-gradient(135deg,#f0e8f8,#e8e0f0);
--scrollbar:#bbb;--pitch-bg:linear-gradient(180deg,#e8e0f0,#d8d0e8);
--search-bg:rgba(0,0,0,.05);--search-border:rgba(0,0,0,.15);
--btn-bg:rgba(0,0,0,.06);--btn-border:rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
body{background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden;height:100vh;user-select:none}
#app{height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}

/* Header */
#header{background:var(--header-bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--header-border);flex-shrink:0;z-index:10}
#header h1{font-size:20px;color:var(--accent);text-shadow:0 0 20px rgba(255,106,176,.5)}
.hdr-left{display:flex;align-items:center;gap:8px}
.song-count-badge{background:var(--accent2);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap}
.hdr-btns button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text-primary);padding:5px 12px;border-radius:18px;font-size:12px;transition:all .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.hdr-btns button:hover,.hdr-btns button.active{background:rgba(255,106,176,.3);border-color:var(--accent)}

/* Search */
.search-wrap{grid-column:1/-1;position:relative;margin-bottom:4px}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;background:var(--search-bg);border:1px solid var(--search-border);border-radius:12px;color:var(--text-primary);font-size:14px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted);pointer-events:none}

/* Favorites filter */
.fav-filter{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.fav-filter button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text-primary);padding:5px 14px;border-radius:16px;font-size:12px;transition:all .2s}
.fav-filter button.active{background:rgba(255,106,176,.3);border-color:var(--accent);color:var(--accent)}

/* Recently played */
.recent-section{grid-column:1/-1;margin-bottom:8px}
.recent-section h4{font-size:13px;color:var(--accent2);margin-bottom:6px}
.recent-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.recent-scroll::-webkit-scrollbar{height:4px}
.recent-card{flex-shrink:0;width:140px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;cursor:pointer;transition:all .2s}
.recent-card:hover{border-color:var(--accent)}
.recent-card .rc-icon{font-size:20px}
.recent-card .rc-title{font-size:12px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Song Select */
#songSelect{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-content:start}
.cat-header{grid-column:1/-1;font-size:14px;font-weight:700;color:var(--accent2);margin:8px 0 2px;padding-left:4px;border-left:3px solid var(--accent2)}
.song-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:14px;padding:14px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;min-height:0;animation:card-enter .4s ease-out both}
.song-card:hover{border-color:var(--card-hover);transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,106,176,.2)}
.song-card .sc-icon{font-size:32px;float:left;margin-right:10px;flex-shrink:0}
.song-card .sc-title{font-size:15px;font-weight:700;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-card .sc-info{font-size:11px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-card .sc-stars{color:var(--accent-gold);font-size:13px;margin-top:4px}
.song-card .sc-high{font-size:10px;color:#8f8;margin-top:2px}
.song-card .sc-grade{position:absolute;top:8px;right:10px;font-size:20px;font-weight:900;opacity:.3}
.song-card .fav-btn{position:absolute;top:8px;right:36px;font-size:18px;background:none;border:none;cursor:pointer;opacity:.5;transition:opacity .2s;padding:0}
.song-card .fav-btn:hover,.song-card .fav-btn.fav-active{opacity:1}
.diff-badge{position:absolute;bottom:8px;right:10px;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.diff-easy{background:#4caf50;color:#fff}.diff-medium{background:#ff9800;color:#fff}.diff-hard{background:#f44336;color:#fff}

@keyframes card-enter{
0%{opacity:0;transform:translateY(20px) scale(.97)}
100%{opacity:1;transform:translateY(0) scale(1)}
}

/* Sing Screen */
#singScreen{flex:1;display:none;flex-direction:column;position:relative}
#pitchArea{flex:1;position:relative;background:var(--pitch-bg);overflow:hidden}
#shaderCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#pitchCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
#particleCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* Lyrics */
#lyricsArea{height:120px;background:var(--lyrics-bg);border-top:2px solid var(--header-border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;flex-shrink:0}
#lyricsArea .cur-lyric{font-size:26px;font-weight:900;color:var(--text-primary);text-align:center;text-shadow:0 0 20px rgba(255,106,176,.6);min-height:34px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
#lyricsArea .cur-lyric .syl{transition:color .15s,transform .15s;display:inline-block}
#lyricsArea .cur-lyric .syl.sung{color:var(--accent-gold);transform:scale(1.15)}
#lyricsArea .cur-lyric .syl.active{color:var(--accent);transform:scale(1.2)}
#lyricsArea .nxt-lyric{font-size:14px;color:rgba(255,255,255,.3);text-align:center;margin-top:6px;min-height:20px}
.lyric-prog{width:80%;max-width:500px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:8px;overflow:hidden}
.lyric-prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .1s linear}

/* Score HUD */
#scoreHUD{position:absolute;top:8px;right:12px;text-align:right;z-index:5}
#scoreHUD .sv{font-size:32px;font-weight:900;color:var(--accent-gold);text-shadow:0 0 12px rgba(255,215,0,.5)}
#scoreHUD .cv{font-size:13px;color:#8f8}
#scoreHUD .pn{font-size:12px;color:var(--text-secondary);margin-top:2px}
#scoreHUD .line-fb{font-size:11px;margin-top:4px;font-weight:700;min-height:16px}

/* Pitch Meter */
#pitchMeter{position:absolute;left:10px;top:8px;bottom:8px;width:36px;background:rgba(255,255,255,.04);border-radius:6px;z-index:5;overflow:hidden}
#pitchMeter .mt{position:absolute;left:0;width:100%;height:20px;background:rgba(76,175,80,.25);border:2px solid #4caf50;border-radius:3px;transition:top .12s}
#pitchMeter .mu{position:absolute;left:0;width:100%;height:6px;background:var(--accent);border-radius:3px;transition:top .06s;box-shadow:0 0 8px rgba(255,106,176,.6)}
#pitchMeter .ml{position:absolute;bottom:3px;width:100%;text-align:center;font-size:8px;color:var(--text-muted)}

/* Timer */
#timerBar{position:absolute;top:0;left:0;right:0;height:3px;z-index:5}
#timerFill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s linear}

/* Controls overlay */
#singControls{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6;opacity:.7;transition:opacity .2s}
#singControls:hover{opacity:1}
#singControls button{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
#singControls button.active{background:rgba(255,106,176,.4);border-color:var(--accent)}

/* Result */
#resultScreen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;overflow-y:auto}
.res-title{font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px}
.res-grade{font-size:80px;font-weight:900;margin:8px 0}
.grade-S{color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.6)}.grade-A{color:#4caf50;text-shadow:0 0 30px rgba(76,175,80,.5)}
.grade-B{color:#2196f3}.grade-C{color:#ff9800}.grade-D{color:#f44336}
.res-score{font-size:48px;font-weight:900;color:var(--accent-gold);text-shadow:0 0 20px rgba(255,215,0,.4)}
.res-stars{font-size:36px;margin:10px 0}
.res-detail{font-size:13px;color:var(--text-secondary);margin-bottom:6px;line-height:1.8}
.res-bars{width:280px;margin:10px auto}
.res-bar-row{display:flex;align-items:center;margin:4px 0;font-size:12px}
.res-bar-row .lbl{width:60px;text-align:right;margin-right:8px;color:#ccc}
.res-bar-row .bar{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.res-bar-row .bar-fill{height:100%;border-radius:5px;transition:width 1s}
.res-bar-row .val{width:36px;text-align:right;margin-left:6px;color:var(--text-primary);font-weight:700}
.res-btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.res-btns button{padding:10px 24px;border:none;border-radius:20px;font-size:14px;font-weight:700;transition:all .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-retry{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-back{background:var(--btn-bg);color:var(--text-primary);border:1px solid var(--btn-border)!important}
.btn-play{background:rgba(76,175,80,.3);color:#8f8;border:1px solid rgba(76,175,80,.4)!important}
.btn-share{background:linear-gradient(135deg,var(--accent2),#6366f1);color:#fff}

/* Practice Modal */
#practiceModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#practiceModal.show{display:flex}
.pm-box{background:var(--modal-box-bg);border:2px solid var(--header-border);border-radius:16px;padding:24px;max-width:360px;width:100%}
.pm-box h3{color:var(--accent);margin-bottom:16px;font-size:18px}
.pm-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:14px}
.pm-row label{color:#ccc}
.pm-row input[type=range]{width:120px;accent-color:var(--accent)}
.pm-row select{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--header-border);border-radius:6px;padding:4px 8px;font-size:13px}
.pm-row .val{color:var(--accent);font-weight:700;width:40px;text-align:right}
.pm-btns{display:flex;gap:8px;margin-top:16px;justify-content:center}
.pm-btns button{padding:8px 20px;border:none;border-radius:16px;font-size:13px;font-weight:700}

/* Mic Prompt */
#micPrompt{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:100;flex-direction:column;align-items:center;justify-content:center}
#micPrompt.show{display:flex}
#micPrompt .mi{font-size:56px;margin-bottom:14px}
#micPrompt p{font-size:16px;color:#ccc;margin-bottom:16px;text-align:center;line-height:1.6;padding:0 20px}
#micPrompt button{padding:12px 32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;border-radius:24px;font-size:15px;font-weight:700}
#micPrompt .skip-btn{background:transparent;color:#888;font-size:13px;margin-top:10px;border:none;text-decoration:underline}

/* High Score Modal */
#hsModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#hsModal.show{display:flex}
.hs-box{background:var(--modal-box-bg);border:2px solid var(--header-border);border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:70vh;overflow-y:auto}
.hs-box h3{color:var(--accent);margin-bottom:12px}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.hs-row .hs-name{color:var(--text-primary)}.hs-row .hs-sc{color:var(--accent-gold);font-weight:700}
.hs-row .hs-gr{font-weight:900;margin-left:6px}

/* Warm-up Modal */
#warmupModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#warmupModal.show{display:flex}
.wu-box{background:var(--modal-box-bg);border:2px solid var(--header-border);border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.wu-box h3{color:var(--accent);margin-bottom:16px;font-size:18px}
.wu-exercise{background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;transition:all .2s}
.wu-exercise:hover{border-color:var(--accent);transform:translateX(4px)}
.wu-exercise .wu-name{font-weight:700;font-size:14px;color:var(--text-primary)}
.wu-exercise .wu-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
.wu-active-area{text-align:center;margin-top:16px}
.wu-pitch-display{font-size:48px;font-weight:900;color:var(--accent-gold);margin:12px 0}
.wu-target{font-size:14px;color:var(--text-secondary)}
.wu-progress{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin:10px 0;overflow:hidden}
.wu-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .2s}
.wu-score{font-size:20px;font-weight:700;color:var(--accent-gold);margin:8px 0}

/* Scroll to top */
#scrollTop{display:none;position:fixed;bottom:70px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;z-index:40;box-shadow:0 4px 12px rgba(255,106,176,.4);cursor:pointer;transition:opacity .2s}
#scrollTop.show{display:flex;align-items:center;justify-content:center}

/* Bottom Tab Bar */
#bottomNav{display:flex;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--header-bg);border-top:2px solid var(--header-border);z-index:45;padding:0;margin:0}
#bottomNav button{flex:1;background:none;border:none;color:var(--text-muted);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:color .2s;padding:0}
#bottomNav button .nav-icon{font-size:20px}
#bottomNav button.active{color:var(--accent)}
#app{padding-bottom:56px}

/* Difficulty Filter Tabs */
.diff-tabs{grid-column:1/-1;display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.diff-tabs button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text-primary);padding:5px 14px;border-radius:16px;font-size:12px;transition:all .2s}
.diff-tabs button.active{background:rgba(255,106,176,.3);border-color:var(--accent);color:var(--accent)}

/* Sort Controls */
.sort-wrap{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.sort-wrap select{background:var(--search-bg);border:1px solid var(--search-border);color:var(--text-primary);padding:5px 10px;border-radius:10px;font-size:12px;outline:none}

/* Today Pick */
.today-pick{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,106,176,.15),rgba(168,85,247,.15));border:2px solid rgba(255,106,176,.3);border-radius:16px;padding:16px;margin-bottom:8px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.today-pick:hover{border-color:var(--accent);transform:scale(1.01)}
.today-pick .tp-badge{position:absolute;top:10px;right:12px;background:var(--accent);color:#fff;font-size:10px;padding:3px 10px;border-radius:10px;font-weight:700}
.today-pick .tp-title{font-size:18px;font-weight:900;color:var(--text-primary)}
.today-pick .tp-sub{font-size:12px;color:var(--text-secondary);margin-top:4px}

/* Statistics Panel */
#statsPanel{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:12px}
.stat-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:14px;padding:16px}
.stat-card h4{color:var(--accent);margin-bottom:10px;font-size:14px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-item{text-align:center;padding:10px;background:var(--btn-bg);border-radius:10px}
.stat-item .si-val{font-size:24px;font-weight:900;color:var(--accent-gold)}
.stat-item .si-lbl{font-size:11px;color:var(--text-secondary);margin-top:4px}
.stat-range{margin-top:10px}
.stat-range .sr-bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.stat-range .sr-bar .sr-fill{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.stat-range .sr-bar .sr-fill div{height:100%;border-radius:4px;transition:width .5s}

/* Achievement Panel */
#achievePanel{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:8px}
.ach-card{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:2px solid var(--card-border);border-radius:14px;padding:14px;transition:all .3s}
.ach-card.unlocked{border-color:var(--accent-gold);box-shadow:0 0 16px rgba(255,215,0,.1)}
.ach-card .ach-icon{font-size:32px;flex-shrink:0;filter:grayscale(1) opacity(.4)}
.ach-card.unlocked .ach-icon{filter:none}
.ach-card .ach-info{flex:1}
.ach-card .ach-name{font-size:14px;font-weight:700;color:var(--text-primary)}
.ach-card .ach-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
.ach-card .ach-date{font-size:10px;color:var(--accent-gold);margin-top:2px}

/* Achievement Toast */
.ach-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,rgba(255,215,0,.95),rgba(255,165,0,.95));color:#1a1040;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;z-index:200;box-shadow:0 8px 32px rgba(255,215,0,.4);transition:transform .4s ease;white-space:nowrap}

<style>
/* =====================================================================
   KaraokeFX - VFX Stylesheet (pure CSS, mobile-responsive)
   Pairs with vfx_effects.js (window.KaraokeFX)
   ===================================================================== */

/* ---------- Layer container ---------- */
.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

/* ---------- Confetti canvas ---------- */
.fx-confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* =====================================================================
   Keyframes
   ===================================================================== */
@keyframes float-up-fade {
  0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
  20%  { transform: translate(-50%, -10px) scale(1.15); opacity: 1; }
  60%  { transform: translate(-50%, -32px) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -64px) scale(0.9); opacity: 0; }
}

@keyframes ring-pulse {
  0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0.9; }
  60%  { opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(var(--combo-scale, 2)); opacity: 0; }
}

@keyframes syllable-bounce {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-18%) scale(1.18); }
  70%  { transform: translateY(0) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes screen-flash {
  0%   { opacity: 0; }
  30%  { opacity: 0.45; }
  100% { opacity: 0; }
}

@keyframes perfect-glow {
  0%   { filter: drop-shadow(0 0 0 #fff8); transform: rotate(0deg) scale(0.6); }
  35%  { filter: drop-shadow(0 0 18px #FFD93D); transform: rotate(45deg) scale(1.2); }
  100% { filter: drop-shadow(0 0 8px #FFD93D); transform: rotate(90deg) scale(1); }
}

@keyframes burst-out {
  0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(0.4); opacity: 0; }
}

@keyframes pop-in {
  0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  50%  { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@keyframes fade-icon {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}

/* =====================================================================
   Judgment burst container
   ===================================================================== */
.fx-judge {
  position: absolute;
  width: clamp(80px, 14vw, 140px);
  height: clamp(80px, 14vw, 140px);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

.fx-judge svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
             fade-icon 0.85s ease-out both;
}

.fx-judge-text {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translate(-50%, 0);
  font-weight: 900;
  font-size: clamp(18px, 3.6vw, 32px);
  letter-spacing: 1px;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 12px currentColor;
  animation: float-up-fade 0.85s ease-out both;
  white-space: nowrap;
}

/* Variant tints */
.fx-judge-perfect svg { animation: perfect-glow 0.6s ease-out both, fade-icon 0.85s ease-out both; }
.fx-judge-perfect .fx-judge-text { font-size: clamp(22px, 4.4vw, 40px); }
.fx-judge-great   svg { filter: drop-shadow(0 0 8px #6BCB77aa); }
.fx-judge-good    svg { filter: drop-shadow(0 0 6px #4D96FFaa); }
.fx-judge-miss    svg { filter: drop-shadow(0 0 4px #FF6B6Baa); opacity: 0.85; }
.fx-judge-miss    .fx-judge-text { font-size: clamp(16px, 3vw, 26px); opacity: 0.9; }

/* =====================================================================
   Particle ring (judge bursts)
   ===================================================================== */
.fx-particle {
  position: absolute;
  width: clamp(6px, 1vw, 10px);
  height: clamp(6px, 1vw, 10px);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: burst-out 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
  box-shadow: 0 0 8px currentColor;
}

/* =====================================================================
   Screen flash (PERFECT)
   ===================================================================== */
.fx-screen-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, #FFD93D88 0%, transparent 70%);
  animation: screen-flash 0.18s ease-out both;
  pointer-events: none;
}

/* =====================================================================
   Combo pulse ring
   ===================================================================== */
.fx-combo-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(80px, 12vw, 140px);
  height: clamp(80px, 12vw, 140px);
  border-radius: 50%;
  border: 4px solid #FFD93D;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: ring-pulse 0.8s ease-out both;
  box-shadow: 0 0 16px #FFD93D88, inset 0 0 16px #FFD93D44;
}

.fx-combo-lo  { border-color: #4D96FF; box-shadow: 0 0 14px #4D96FF99, inset 0 0 14px #4D96FF44; }
.fx-combo-mid { border-color: #6BCB77; box-shadow: 0 0 18px #6BCB77aa, inset 0 0 18px #6BCB7755; }
.fx-combo-hi  { border-color: #FFD93D; border-width: 6px; box-shadow: 0 0 32px #FFD93D, inset 0 0 24px #FFD93Daa; }

/* =====================================================================
   Lyrics syllable bounce
   ===================================================================== */
.fx-syllable-bounce {
  display: inline-block;
  animation: syllable-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  transform-origin: 50% 100%;
  color: #FFD93D;
  text-shadow: 0 2px 8px #FFD93D88, 0 0 4px #fff;
}

/* =====================================================================
   Reduced motion fallback
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {
  .fx-judge svg,
  .fx-judge-text,
  .fx-particle,
  .fx-combo-ring,
  .fx-syllable-bounce,
  .fx-screen-flash {
    animation-duration: 0.1s !important;
    animation-iteration-count: 1 !important;
  }
}

/* =====================================================================
   Mobile tweaks
   ===================================================================== */
@media (max-width: 480px) {
  .fx-judge { width: clamp(60px, 22vw, 100px); height: clamp(60px, 22vw, 100px); }
  .fx-judge-text { font-size: clamp(16px, 5vw, 24px); }
  .fx-combo-ring { width: clamp(60px, 22vw, 110px); height: clamp(60px, 22vw, 110px); }
}

/* =====================================================================
   Compose hooks for v3 host elements
   ===================================================================== */
#pitchArea .fx-syllable-bounce {
  will-change: transform;
}

#particleCanvas + .fx-confetti-canvas {
  z-index: 1;
}

/* Stage glow helper */
.fx-stage-pulse {
  animation: stage-pulse 1.4s ease-in-out infinite;
}

@keyframes stage-pulse {
  0%, 100% { box-shadow: inset 0 0 30px 4px rgba(255, 217, 61, 0.4); }
  50%      { box-shadow: inset 0 0 60px 14px rgba(255, 217, 61, 0.8); }
}

/* SVG icon defaults */
.fx-star-svg,
.fx-check-svg,
.fx-circle-svg,
.fx-x-svg {
  display: block;
  overflow: visible;
}
</style>

<script>
/* KaraokeAudio v4 — robust pitch engine
 * Implements McLeod Pitch Method (NSDF) inline + octave correction + median filter
 * + per-note scoring + user-range estimation. Pure vanilla browser. No imports.
 */
(function (global) {
  'use strict';

  var ctx = null;
  var ana = null;
  var BUF = 2048;
  var buf = null;
  var freqBuf = null;
  var freqHist = [];
  var medianWin = [];
  var note = null;
  var rangeStartT = 0;
  var rangeFreqs = [];
  var rangeDoneAt = 0;
  var lastRMS = 0;
  var lastCentroid = 0;
  var lastFlatness = 0;
  var _lastDetection = null;

  function init(audioCtx, analyserNode, bufSize) {
    ctx = audioCtx;
    ana = analyserNode;
    BUF = bufSize || 2048;
    buf = new Float32Array(BUF);
    freqBuf = new Float32Array(ana ? ana.frequencyBinCount : BUF / 2);
    resetSession();
    rangeStartT = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    rangeDoneAt = 0;
    rangeFreqs = [];
  }

  function resetSession() {
    freqHist = [];
    medianWin = [];
    note = null;
  }

  function nsdf(x) {
    var n = x.length;
    var half = n >> 1;
    var out = new Float32Array(half);
    for (var t = 0; t < half; t++) {
      var ac = 0, m = 0;
      for (var j = 0; j < n - t; j++) {
        var a = x[j], b = x[j + t];
        ac += a * b;
        m += a * a + b * b;
      }
      out[t] = m > 0 ? (2 * ac) / m : 0;
    }
    return out;
  }

  function pickPeak(ns) {
    var n = ns.length;
    var i = 1;
    while (i < n - 1 && ns[i] > 0) i++;
    while (i < n - 1 && ns[i] <= 0) i++;
    if (i >= n - 1) return -1;
    var peakIdx = -1, peakVal = -1;
    for (; i < n - 1; i++) {
      if (ns[i] > ns[i - 1] && ns[i] >= ns[i + 1] && ns[i] > peakVal) {
        peakVal = ns[i];
        peakIdx = i;
      }
    }
    return peakIdx;
  }

  function parabolic(a, k) {
    if (k <= 0 || k >= a.length - 1) return { x: k, y: a[k] };
    var l = a[k - 1], c = a[k], r = a[k + 1];
    var denom = (l - 2 * c + r);
    var dx = denom !== 0 ? 0.5 * (l - r) / denom : 0;
    if (!isFinite(dx) || dx > 1 || dx < -1) dx = 0;
    var y = c - 0.25 * (l - r) * dx;
    return { x: k + dx, y: y };
  }

  function computeRMS(x) {
    var s = 0;
    for (var i = 0; i < x.length; i++) s += x[i] * x[i];
    return Math.sqrt(s / x.length);
  }

  function computeFlatnessAndCentroid() {
    if (!ana || !freqBuf) return { flat: 0, cent: 0 };
    ana.getFloatFrequencyData(freqBuf);
    var n = freqBuf.length;
    var mags = new Float32Array(n);
    var sumMag = 0, logSum = 0, valid = 0;
    var sr = ctx ? ctx.sampleRate : 44100;
    var binHz = sr / 2 / n;
    var weighted = 0;
    for (var i = 1; i < n; i++) {
      var db = freqBuf[i];
      if (db < -120) db = -120;
      var lin = Math.pow(10, db / 20);
      mags[i] = lin;
      sumMag += lin;
      weighted += lin * (i * binHz);
      if (lin > 1e-10) { logSum += Math.log(lin); valid++; }
    }
    var flat = 0;
    if (valid > 0 && sumMag > 0) {
      var geo = Math.exp(logSum / valid);
      var arith = sumMag / (n - 1);
      flat = arith > 0 ? geo / arith : 0;
    }
    var cent = sumMag > 0 ? weighted / sumMag : 0;
    return { flat: flat, cent: cent };
  }

  function trimHist(now) {
    var cutoff = now - 200;
    while (freqHist.length && freqHist[0].t < cutoff) freqHist.shift();
  }

  function octaveCorrect(f, now) {
    trimHist(now);
    if (!freqHist.length) return f;
    var s = 0;
    for (var i = 0; i < freqHist.length; i++) s += Math.log(freqHist[i].f);
    var mean = Math.exp(s / freqHist.length);
    var d0 = Math.abs(1200 * Math.log2(f / mean));
    if (d0 <= 600) return f;
    var fUp = f * 2, fDn = f / 2;
    var dUp = Math.abs(1200 * Math.log2(fUp / mean));
    var dDn = Math.abs(1200 * Math.log2(fDn / mean));
    var best = f, bd = d0;
    if (dUp < bd) { best = fUp; bd = dUp; }
    if (dDn < bd) { best = fDn; bd = dDn; }
    return best;
  }

  function medianFilter(f) {
    medianWin.push(f);
    if (medianWin.length > 5) medianWin.shift();
    var sorted = medianWin.slice().sort(function (a, b) { return a - b; });
    return sorted[Math.floor(sorted.length / 2)];
  }

  function detectPitch() {
    if (!ctx || !ana || !buf) { _lastDetection = null; return null; }
    ana.getFloatTimeDomainData(buf);
    var sm = computeFlatnessAndCentroid();
    lastFlatness = sm.flat;
    lastCentroid = sm.cent;
    var rms = computeRMS(buf);
    lastRMS = rms;
    var voiced = (rms > 0.018) && (sm.flat < 0.5);
    if (!voiced) { _lastDetection = null; return null; }
    var ns = nsdf(buf);
    var k = pickPeak(ns);
    if (k < 2) { _lastDetection = null; return null; }
    var clarity = ns[k];
    if (clarity < 0.85) { _lastDetection = { freq: 0, clarity: clarity, voiced: false }; return null; }
    var refined = parabolic(ns, k);
    var lag = refined.x;
    if (lag <= 0) { _lastDetection = null; return null; }
    var freq = ctx.sampleRate / lag;
    if (freq < 80 || freq > 1000) { _lastDetection = null; return null; }
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var fc = octaveCorrect(freq, now);
    var fm = medianFilter(fc);
    freqHist.push({ t: now, f: fm });
    if (rangeDoneAt === 0) {
      if (now - rangeStartT <= 5000) { rangeFreqs.push(fm); }
      else { rangeDoneAt = now; }
    }
    if (note && note.target) {
      var cents = 1200 * Math.log2(fm / note.target);
      note.voiced++;
      note.centsSum += cents;
      note.framesAbs += Math.abs(cents);
    }
    if (note) note.total++;
    var _out = { freq: fm, clarity: clarity, voiced: true };
    _lastDetection = _out;
    return _out;
  }

  function startNote(targetFreq, noteId) {
    note = { target: targetFreq, id: noteId, voiced: 0, total: 0, centsSum: 0, framesAbs: 0 };
  }

  function endNote() {
    if (!note) return { avgCents: 0, hitFrames: 0, totalFrames: 0, grade: 'MISS' };
    var avgCents = note.voiced > 0 ? (note.centsSum / note.voiced) : 9999;
    var abs = Math.abs(avgCents);
    var grade;
    if (note.voiced === 0) grade = 'MISS';
    else if (abs < 25) grade = 'PERFECT';
    else if (abs < 50) grade = 'GREAT';
    else if (abs < 100) grade = 'GOOD';
    else grade = 'MISS';
    var result = { avgCents: avgCents, hitFrames: note.voiced, totalFrames: note.total, grade: grade };
    note = null;
    return result;
  }

  function estimateUserRange() {
    if (rangeFreqs.length < 5) return { meanFreq: 0, suggestedKeyShift: 0 };
    var s = 0;
    for (var i = 0; i < rangeFreqs.length; i++) s += Math.log(rangeFreqs[i]);
    var meanFreq = Math.exp(s / rangeFreqs.length);
    var anchor = 220;
    var semis = 12 * Math.log2(meanFreq / anchor);
    var candidates = [-5, -3, -2, 0, 2, 3, 5];
    var best = 0, bd = 1e9;
    for (var j = 0; j < candidates.length; j++) {
      var d = Math.abs(candidates[j] - (-semis));
      if (d < bd) { bd = d; best = candidates[j]; }
    }
    return { meanFreq: meanFreq, suggestedKeyShift: best };
  }

  function getRMS() { return lastRMS; }
  function getSpectralCentroid() { return lastCentroid; }

  global.KaraokeAudio = {
    init: init,
    detectPitch: detectPitch,
    resetSession: resetSession,
    startNote: startNote,
    endNote: endNote,
    estimateUserRange: estimateUserRange,
    getRMS: getRMS,
    getSpectralCentroid: getSpectralCentroid,
    getLastDetection: function () { return _lastDetection; }
  };
})(typeof window !== 'undefined' ? window : this);
</script>

<script>
/* KaraokeShader v4 — WebGL2 fluid k-pop background */
(function () {
  'use strict';

  const VERT_SRC = `#version 300 es
  precision highp float;
  out vec2 vUV;
  void main() {
    vec2 p = vec2((gl_VertexID & 1) * 2 - 1, (gl_VertexID & 2) - 1);
    vUV = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
  }`;

  const FRAG_SRC = `#version 300 es
  precision highp float;
  in vec2 vUV;
  out vec4 fragColor;
  uniform vec2  uResolution;
  uniform float uTime;
  uniform float uRMS;
  uniform float uCentroid;
  uniform float uBeat;
  uniform float uCombo;
  uniform int   uMode;
  uniform float uPerfectStart;
  const vec3 PURPLE = vec3(0.659, 0.333, 0.969);
  const vec3 PINK   = vec3(1.000, 0.416, 0.690);
  const vec3 GOLD   = vec3(1.000, 0.843, 0.000);
  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0; float a = 0.5;

  function init(audioCtx) {
    ctx = audioCtx;
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.12;

  }

    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, ctx.currentTime);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(ctx.currentTime + i * 0.02);
      osc.stop(ctx.currentTime + duration);
    });
  }

  function playArpeggio(notes, beatDur) {
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * beatDur / notes.length;
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + beatDur / notes.length * 0.8);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + beatDur / notes.length);

  }

    gain.gain.setValueAtTime(0.3, ctx.currentTime);

// ===================== AUDIO ENGINE =====================
let audioCtx=null,analyser=null,micStream=null,micOn=false,micSource=null;
const BUF=2048;let aBuf=new Float32Array(BUF);
// Reverb
let reverbNode=null,reverbDry=null,reverbWet=null,reverbOn=false;
let bgmOn=false;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}

function createReverbIR(ctx,duration,decay){
  const len=ctx.sampleRate*duration;
  const buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const data=buf.getChannelData(ch);
    for(let i=0;i<len;i++){
      data[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
  }
  return buf;
}

function setupReverb(){
  if(!audioCtx||reverbNode)return;
  reverbNode=audioCtx.createConvolver();
  reverbNode.buffer=createReverbIR(audioCtx,1.5,2.5);
  reverbDry=audioCtx.createGain();reverbDry.gain.value=1;
  reverbWet=audioCtx.createGain();reverbWet.gain.value=0;
  reverbDry.connect(audioCtx.destination);
  reverbNode.connect(reverbWet);
  reverbWet.connect(audioCtx.destination);
}

async function startMic(){
  try{
    initAudio();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    micSource=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=BUF;
    micSource.connect(analyser);
    // Setup reverb + echo chain for mic
    setupReverb();
    setupEcho();
    if(reverbNode&&micSource){
      micSource.connect(reverbDry);
      micSource.connect(reverbNode);
    }
    if(echoNode&&micSource){
      micSource.connect(echoNode);
    }
    micOn=true;
    if(window.KaraokeAudio)KaraokeAudio.init(audioCtx,analyser,BUF);
    if(window.KaraokeBGM)KaraokeBGM.init(audioCtx);
    document.getElementById('btnMic').textContent='마이크 ON';
    document.getElementById('btnMic').classList.add('active');
    return true;
  }catch(e){console.error('Mic:',e);return false;}
}
function stopMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}micOn=false;micSource=null;document.getElementById('btnMic').textContent='마이크 OFF';document.getElementById('btnMic').classList.remove('active');}

function detectPitch(){
  if(!analyser||!micOn)return null;
  if(!window.KaraokeAudio)return null;
  const r=KaraokeAudio.detectPitch();
  return r?r.freq:null;
}

// Synth for guide melody
let synthOsc=null,synthGain=null,guideOn=true;
function playSynth(f){
  if(!guideOn)return;initAudio();
  if(!synthOsc){synthOsc=audioCtx.createOscillator();synthGain=audioCtx.createGain();synthOsc.type='triangle';synthGain.gain.value=0.06;synthOsc.connect(synthGain);synthGain.connect(audioCtx.destination);synthOsc.start();}
  synthOsc.frequency.setValueAtTime(f,audioCtx.currentTime);synthGain.gain.setValueAtTime(0.06,audioCtx.currentTime);
}
function muteSynth(){if(synthGain)synthGain.gain.setValueAtTime(0,audioCtx.currentTime);}
function killSynth(){if(synthOsc){try{synthOsc.stop();}catch(e){}synthOsc=null;synthGain=null;}}

// Recording
let recorder=null,recordChunks=[],recordedBlob=null;
function startRecording(){
  if(!micStream)return;
  try{recorder=new MediaRecorder(micStream);recordChunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0)recordChunks.push(e.data);};
  recorder.onstop=()=>{recordedBlob=new Blob(recordChunks,{type:'audio/webm'});};
  recorder.start();}catch(e){recorder=null;}
}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop();}

// Scores
function getHS(){try{return JSON.parse(localStorage.getItem('sv3_hs')||'{}');}catch(e){return {};}}
function saveHS(id,s,g){const h=getHS();if(!h[id]||s>h[id].s){h[id]={s,g};localStorage.setItem('sv3_hs',JSON.stringify(h));}}
function getGrade(s){if(s>=95)return'S';if(s>=85)return'A';if(s>=70)return'B';if(s>=50)return'C';return'D';}
function getStars(s){if(s>=95)return 5;if(s>=80)return 4;if(s>=60)return 3;if(s>=40)return 2;if(s>=20)return 1;return 0;}

// ===================== ECHO EFFECT =====================
let echoNode=null,echoGain=null,echoFeedback=null,echoOn=false;
function setupEcho(){
  if(!audioCtx||echoNode)return;
  echoNode=audioCtx.createDelay(1);echoNode.delayTime.value=0.25;
  echoGain=audioCtx.createGain();echoGain.gain.value=0;
  echoFeedback=audioCtx.createGain();echoFeedback.gain.value=0.3;
  echoNode.connect(echoGain);echoGain.connect(audioCtx.destination);
  echoNode.connect(echoFeedback);echoFeedback.connect(echoNode);
}

// ===================== APPLAUSE SFX =====================
function playApplause(){
  if(!audioCtx)return;
  const dur=2.5,sr=audioCtx.sampleRate;
  const buf=audioCtx.createBuffer(1,sr*dur,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const env=Math.pow(1-i/d.length,0.8)*0.15;
    d[i]=(Math.random()*2-1)*env*(1+0.3*Math.sin(i/sr*6));
  }
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const flt=audioCtx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=3000;flt.Q.value=0.5;
  src.connect(flt);flt.connect(audioCtx.destination);src.start();
}

// ===================== STATISTICS =====================
function getStats(){try{return JSON.parse(localStorage.getItem('sv6_stats')||'{}');}catch(e){return {};}}
function saveStats(s){localStorage.setItem('sv6_stats',JSON.stringify(s));}
function updateStats(songId,score,grade,pitchAcc,maxCombo){
  const s=getStats();
  if(!s.totalSongs)s.totalSongs=0;
  if(!s.totalScore)s.totalScore=0;
  if(!s.grades)s.grades={S:0,A:0,B:0,C:0,D:0};
  if(!s.songPlays)s.songPlays={};
  if(!s.bestCombo)s.bestCombo=0;
  if(!s.totalPitch)s.totalPitch=0;
  if(!s.practiceCount)s.practiceCount=0;
  if(!s.firstPlayDate)s.firstPlayDate=new Date().toISOString().slice(0,10);
  s.totalSongs++;
  s.totalScore+=score;
  if(s.grades[grade]!==undefined)s.grades[grade]++;
  s.songPlays[songId]=(s.songPlays[songId]||0)+1;
  if(maxCombo>s.bestCombo)s.bestCombo=maxCombo;
  s.totalPitch+=pitchAcc;
  s.lastPlayDate=new Date().toISOString().slice(0,10);
  saveStats(s);
  checkAchievements(s);
}

// ===================== DAILY PICK =====================
function getDailyPick(){
  const today=new Date();
  const seed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
  return SONGS[seed%SONGS.length];
}

// ===================== SEARCH STATE =====================
let searchQuery='';
let showFavsOnly=false;
let diffFilter='all';
let sortBy='default';

// ===================== RENDER SONG LIST =====================
function renderList(){
  const c=document.getElementById('songSelect');c.innerHTML='';
  const hs=getHS();
  const favs=getFavs();
  const recent=getRecent();

  // Search bar
  const searchWrap=document.createElement('div');searchWrap.className='search-wrap';
  searchWrap.innerHTML='<span class="search-icon">🔍</span><input type="text" placeholder="노래 검색... (/ 단축키)" id="searchInput" value="'+searchQuery.replace(/"/g,'&amp;quot;')+'" aria-label="노래 검색">';
  c.appendChild(searchWrap);
  setTimeout(()=>{
    const si=document.getElementById('searchInput');
    if(si)si.oninput=function(){searchQuery=this.value;renderList();};
  },0);

  // Favorites filter + Difficulty tabs
  const filterRow=document.createElement('div');filterRow.className='fav-filter';
  filterRow.innerHTML='<button id="btnFavFilter" class="'+(showFavsOnly?'active':'')+'" aria-pressed="'+showFavsOnly+'">❤️ 즐겨찾기</button>';
  c.appendChild(filterRow);

  const diffTabs=document.createElement('div');diffTabs.className='diff-tabs';
  const diffs=[{k:'all',l:'전체'},{k:'쉬움',l:'쉬움'},{k:'보통',l:'보통'},{k:'어려움',l:'어려움'}];
  diffs.forEach(d=>{
    diffTabs.innerHTML+='<button data-diff="'+d.k+'" class="'+(diffFilter===d.k?'active':'')+'">'+d.l+'</button>';
  });
  c.appendChild(diffTabs);

  // Sort controls
  const sortWrap=document.createElement('div');sortWrap.className='sort-wrap';
  sortWrap.innerHTML='<select id="sortSelect" aria-label="정렬"><option value="default"'+(sortBy==='default'?' selected':'')+'>기본순</option><option value="name"'+(sortBy==='name'?' selected':'')+'>이름순</option><option value="diff"'+(sortBy==='diff'?' selected':'')+'>난이도순</option><option value="score"'+(sortBy==='score'?' selected':'')+'>점수순</option><option value="bpm"'+(sortBy==='bpm'?' selected':'')+'>BPM순</option></select>';
  c.appendChild(sortWrap);

  setTimeout(()=>{
    const bf=document.getElementById('btnFavFilter');
    if(bf)bf.onclick=()=>{showFavsOnly=!showFavsOnly;renderList();};
    document.querySelectorAll('.diff-tabs button').forEach(b=>{
      b.onclick=()=>{diffFilter=b.getAttribute('data-diff');renderList();};
    });
    const ss=document.getElementById('sortSelect');
    if(ss)ss.onchange=function(){sortBy=this.value;renderList();};
  },0);

  // Filter songs
  let filtered=SONGS.filter(s=>{
    if(showFavsOnly&&!isFav(s.id))return false;
    if(diffFilter!=='all'&&s.diff!==diffFilter)return false;
    if(searchQuery){
      const q=searchQuery.toLowerCase();
      return s.title.toLowerCase().includes(q)||s.cat.toLowerCase().includes(q);
    }
    return true;
  });

  // Sort
  if(sortBy==='name')filtered.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  else if(sortBy==='diff'){const dOrder={쉬움:0,보통:1,어려움:2};filtered.sort((a,b)=>dOrder[a.diff]-dOrder[b.diff]);}
  else if(sortBy==='score')filtered.sort((a,b)=>{const ha=hs[a.id],hb=hs[b.id];return(hb?hb.s:0)-(ha?ha.s:0);});
  else if(sortBy==='bpm')filtered.sort((a,b)=>a.bpm-b.bpm);

  // Daily Pick
  if(!showFavsOnly&&!searchQuery&&diffFilter==='all'){
    const daily=getDailyPick();
    const tp=document.createElement('div');tp.className='today-pick';
    tp.setAttribute('role','button');tp.setAttribute('aria-label','오늘의 추천곡: '+daily.title);
    tp.innerHTML='<div class="tp-badge">오늘의 추천</div>'+
      '<div style="font-size:36px;margin-bottom:6px">'+daily.icon+'</div>'+
      '<div class="tp-title">'+daily.title+'</div>'+
      '<div class="tp-sub">'+daily.cat+' &middot; BPM '+daily.bpm+' &middot; '+daily.diff+'</div>';
    tp.onclick=()=>pickSong(daily,false);
    c.appendChild(tp);
  }

  // Recently played section
  if(recent.length>0&&!showFavsOnly&&!searchQuery){
    const sect=document.createElement('div');sect.className='recent-section';
    sect.innerHTML='<h4>최근 재생</h4>';
    const scroll=document.createElement('div');scroll.className='recent-scroll';
    recent.forEach(rid=>{
      const song=SONGS.find(s=>s.id===rid);
      if(!song)return;
      const rc=document.createElement('div');rc.className='recent-card';rc.setAttribute('role','button');
      rc.innerHTML='<div class="rc-icon">'+song.icon+'</div><div class="rc-title">'+song.title+'</div>';
      rc.onclick=()=>pickSong(song,false);
      scroll.appendChild(rc);
    });
    sect.appendChild(scroll);
    c.appendChild(sect);
  }

  // Favorites section at top
  if(favs.length>0&&!showFavsOnly&&!searchQuery&&diffFilter==='all'){
    const favSongs=SONGS.filter(s=>favs.includes(s.id));
    if(favSongs.length>0){
      const h=document.createElement('div');h.className='cat-header';h.textContent='❤️ 즐겨찾기';c.appendChild(h);
      favSongs.forEach((song,idx)=>renderSongCard(c,song,hs,idx));
    }
  }

  // Categories
  const cats=[...new Set(filtered.map(s=>s.cat))];
  let cardIdx=0;
  cats.forEach(cat=>{
    const catSongs=filtered.filter(s=>s.cat===cat);
    if(catSongs.length===0)return;
    const h=document.createElement('div');h.className='cat-header';h.textContent=cat+' ('+catSongs.length+')';c.appendChild(h);
    catSongs.forEach(song=>{renderSongCard(c,song,hs,cardIdx++);});
  });

  // Update badge
  document.getElementById('songCountBadge').textContent=SONGS.length;
}

function renderSongCard(container,song,hs,idx){
  const d=document.createElement('div');d.className='song-card';
  d.style.animationDelay=(idx*0.05)+'s';
  const rec=hs[song.id];const stars=rec?getStars(rec.s):0;
  const favActive=isFav(song.id)?'fav-active':'';
  const favHeart=isFav(song.id)?'❤️':'🤍';
  d.innerHTML='<div class="diff-badge '+song.dc+'">'+song.diff+'</div>'+
    '<button class="fav-btn '+favActive+'" data-id="'+song.id+'">'+favHeart+'</button>'+
    '<div class="sc-icon">'+song.icon+'</div>'+
    '<div class="sc-title">'+song.title+'</div>'+
    '<div class="sc-info">BPM '+song.bpm+' &middot; '+song.dur+'초</div>'+
    '<div class="sc-stars">'+(stars>0?'★'.repeat(stars)+'☆'.repeat(5-stars):'☆☆☆☆☆')+'</div>'+
    (rec?'<div class="sc-high">최고 '+rec.s+'점</div>':'')+
    (rec?'<div class="sc-grade grade-'+rec.g+'">'+rec.g+'</div>':'');
  d.querySelector('.fav-btn').onclick=(e)=>{e.stopPropagation();toggleFav(song.id);};
  d.onclick=(e)=>{if(e.target.classList.contains('fav-btn'))return;pickSong(song,false);};
  let lt;d.onpointerdown=()=>{lt=setTimeout(()=>openPractice(song),600);};
  d.onpointerup=()=>clearTimeout(lt);d.onpointerleave=()=>clearTimeout(lt);
  container.appendChild(d);
}

// ===================== WARM-UP MODE =====================
const WARMUP_EXERCISES=[
  {name:"음계 올라가기",desc:"도레미파솔라시도 올라가기",notes:[C4,D4,E4,F4,G4,A4,B4,C5],dur:8},
  {name:"음계 내려가기",desc:"도시라솔파미레도 내려가기",notes:[C5,B4,A4,G4,F4,E4,D4,C4],dur:8},
  {name:"장음 유지",desc:"한 음을 3초간 유지하세요",notes:[G4,G4,G4],dur:9},
  {name:"반복 스타카토",desc:"짧게 끊어서 반복하세요",notes:[C4,E4,C4,E4,C4,E4,C4,E4],dur:8},
  {name:"옥타브 점프",desc:"낮은 도 → 높은 도 점프",notes:[C4,C5,C4,C5,C4,C5],dur:6}
];
let warmupActive=false,warmupExIdx=-1,warmupNoteIdx=0,warmupStartT=0,warmupScore=0,warmupHits=0,warmupTotal=0;
let warmupAnimId=null;

function openWarmup(){
  const m=document.getElementById('warmupModal');m.classList.add('show');
  renderWarmupMenu();
}
function closeWarmup(){
  warmupActive=false;
  if(warmupAnimId)cancelAnimationFrame(warmupAnimId);
  document.getElementById('warmupModal').classList.remove('show');
  muteSynth();
}
function renderWarmupMenu(){
  const box=document.getElementById('wuBox');
  let html='<h3>🎙️ 워밍업 연습</h3>';
  WARMUP_EXERCISES.forEach((ex,i)=>{
    html+='<div class="wu-exercise" onclick="startWarmupEx('+i+')"><div class="wu-name">'+(i+1)+'. '+ex.name+'</div><div class="wu-desc">'+ex.desc+'</div></div>';
  });
  html+='<div style="text-align:center;margin-top:16px"><button class="btn-back" onclick="closeWarmup()">닫기</button></div>';
  box.innerHTML=html;
}
window.startWarmupEx=function(idx){
  if(!micOn){alert('마이크를 먼저 켜주세요!');return;}
  warmupExIdx=idx;warmupNoteIdx=0;warmupScore=0;warmupHits=0;warmupTotal=0;
  warmupActive=true;warmupStartT=performance.now();
  warmupLoop();
};
function warmupLoop(){
  if(!warmupActive)return;
  const ex=WARMUP_EXERCISES[warmupExIdx];
  const elapsed=(performance.now()-warmupStartT)/1000;
  const noteDur=ex.dur/ex.notes.length;
  const curIdx=Math.min(Math.floor(elapsed/noteDur),ex.notes.length-1);
  warmupNoteIdx=curIdx;
  const targetF=ex.notes[curIdx];
  playSynth(targetF);
  const userFreq=detectPitch();
  let accuracy='';
  if(userFreq&&targetF){
    const cents=Math.abs(1200*Math.log2(userFreq/targetF));
    if(cents<25){accuracy='PERFECT!';warmupHits++;}
    else if(cents<50){accuracy='GREAT!';}
    else if(cents<100){accuracy='GOOD';}
    else{accuracy='---';}
    warmupTotal++;
  }

  const box=document.getElementById('wuBox');
  const prog=Math.min(100,(elapsed/ex.dur)*100);
  const targetNote=freqToNote(targetF);
  const userNote=userFreq?freqToNote(userFreq):'---';
  const sc=warmupTotal>0?Math.round(warmupHits/warmupTotal*100):0;

  box.innerHTML='<h3>🎙️ '+ex.name+'</h3>'+
    '<div class="wu-active-area">'+
    '<div class="wu-target">목표 음: <b>'+targetNote+'</b></div>'+
    '<div class="wu-pitch-display">'+userNote+'</div>'+
    '<div style="font-size:14px;color:'+(accuracy.includes('PERFECT')?'#ffd700':accuracy.includes('GREAT')?'#4caf50':'#aaa')+'">'+accuracy+'</div>'+
    '<div class="wu-progress"><div class="wu-progress-bar" style="width:'+prog+'%"></div></div>'+
    '<div class="wu-score">점수: '+sc+'%</div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:12px"><button class="btn-back" onclick="closeWarmup()">중지</button></div>';

  if(elapsed>=ex.dur){
    warmupActive=false;muteSynth();
    box.innerHTML='<h3>🎙️ '+ex.name+' 완료!</h3>'+
      '<div class="wu-active-area"><div class="wu-score" style="font-size:36px">'+sc+'점</div>'+
      '<div style="color:#aaa;margin-top:8px">'+(sc>=80?'훌륭합니다!':sc>=50?'좋아요! 계속 연습하세요':'더 연습해 봅시다!')+'</div></div>'+
      '<div style="text-align:center;margin-top:16px;display:flex;gap:8px;justify-content:center">'+
      '<button class="btn-retry" onclick="startWarmupEx('+warmupExIdx+')">다시 하기</button>'+
      '<button class="btn-back" onclick="renderWarmupMenu()">목록</button>'+
      '<button class="btn-back" onclick="closeWarmup()">닫기</button></div>';
    return;
  }
  warmupAnimId=requestAnimationFrame(warmupLoop);
}

window.startPractice=function(id){
  const song=SONGS.find(s=>s.id===id);
  practiceMode=true;
  tempoMul=parseInt(document.getElementById('pmTempo').value)/100;
  showNoteNames=document.getElementById('pmNotes').value==='1';
  guideOn=document.getElementById('pmGuide').value==='1';
  const bgmVol=parseInt(document.getElementById('pmBGMVol').value)/100;
  if(window.KaraokeBGM)KaraokeBGM.setVolume(bgmVol);
  const loop=document.getElementById('pmLoop').value;
  if(loop==='1'){loopStart=0;loopEnd=Math.min(song.dur/2,song.dur);}
  else if(loop==='2'){const half=song.dur/2;loopStart=half;loopEnd=song.dur;}
  else{loopStart=-1;loopEnd=-1;}
  document.getElementById('practiceModal').classList.remove('show');
  pickSong(song,true);
};

// ===================== PICK SONG =====================
async function pickSong(song,isPractice){
  curSong=song;score=0;combo=0;maxCombo=0;totalN=0;hitN=0;pitchSum=0;rhythmSum=0;
  userPH=[];lineScores=[];keyShift=0;particles=[];recordedBlob=null;
  paused=false;pauseAccum=0;
  curNoteId=null;beatPulse=0;comboMilestones={5:false,10:false,20:false};
  if(window.KaraokeAudio)KaraokeAudio.resetSession();
  if(!isPractice){practiceMode=false;tempoMul=1;showNoteNames=false;guideOn=true;loopStart=-1;loopEnd=-1;}
  addRecent(song.id);
  if(!micOn){
    document.getElementById('micPrompt').classList.add('show');
    document.getElementById('btnAllowMic').onclick=async()=>{
      await startMic();document.getElementById('micPrompt').classList.remove('show');beginSing();
    };
    document.getElementById('btnSkipMic').onclick=()=>{document.getElementById('micPrompt').classList.remove('show');beginSing();};
    return;
  }
  beginSing();
  window.__keyShiftSuggested=false;
  setTimeout(()=>{
    if(window.__keyShiftSuggested||gState!=='singing')return;
    const r=KaraokeAudio.estimateUserRange?KaraokeAudio.estimateUserRange():null;
    if(r&&Math.abs(r.suggestedKeyShift)>=2){
      const div=document.createElement('div');
      div.style.cssText='position:absolute;top:60px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(168,85,247,.95),rgba(255,106,176,.95));color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:30;box-shadow:0 4px 20px rgba(255,106,176,.4);cursor:pointer;animation:fade-in .3s';
      const dir=r.suggestedKeyShift>0?'+':'';
      div.textContent='\u{1F3B5} 음역 추천: 키 '+dir+r.suggestedKeyShift+' (탭하여 적용)';
      div.onclick=()=>{keyShift=r.suggestedKeyShift;div.remove();window.__keyShiftSuggested=true;};
      document.getElementById('singScreen').appendChild(div);
      setTimeout(()=>{if(div.parentNode){div.style.opacity='0';setTimeout(()=>{if(div.parentNode)div.remove();},300);}},5000);
      window.__keyShiftSuggested=true;
    }
  },5000);
}

function beginSing(){
  gState='singing';
  document.getElementById('songSelect').style.display='none';
  document.getElementById('singScreen').style.display='flex';
  document.getElementById('resultScreen').style.display='none';
  initAudio();if(audioCtx.state==='suspended')audioCtx.resume();
  const c=document.getElementById('pitchCanvas');c.width=c.parentElement.clientWidth;c.height=c.parentElement.clientHeight;
  const pc=document.getElementById('particleCanvas');pc.width=pc.parentElement.clientWidth;pc.height=pc.parentElement.clientHeight;
  const sc=document.getElementById('shaderCanvas');
  if(sc&&window.KaraokeShader){
    sc.style.display='block';
    shaderOn=KaraokeShader.init(sc);
    if(!shaderOn){sc.style.display='none';}
    else{KaraokeShader.setMode('singing');}
  }else if(sc){sc.style.display='none';shaderOn=false;}
  if(window.KaraokeFX)KaraokeFX.init(document.getElementById('pitchArea'));
  // BGM
  if(window.KaraokeBGM&&bgmOn){
    KaraokeBGM.init(audioCtx);
    KaraokeBGM.start(curSong.bpm);
  }
  startT=performance.now();
  if(micOn)startRecording();
  document.getElementById('btnGuide').classList.toggle('active',guideOn);
  document.getElementById('btnBGM').classList.toggle('active',bgmOn);
  document.getElementById('btnReverb').classList.toggle('active',reverbOn);
  document.getElementById('btnEcho').classList.toggle('active',echoOn);
  document.getElementById('bottomNav').style.display='none';
  gameLoop();
}

// ===================== PARTICLES =====================
function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,life:1,color,size:Math.random()*3+1});
  }
}
function spawnFireworks(canvas){
  const cx=Math.random()*canvas.width,cy=Math.random()*canvas.height*.5;
  const colors=['#ffd700','#ff6ab0','#4caf50','#2196f3','#ff9800'];
  for(let i=0;i<30;i++){
    const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;
    particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:colors[i%colors.length],size:Math.random()*2+1});
  }
}
function updateParticles(ctx){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===================== GAME LOOP =====================
let lastLineFbTime=0,lastLineFbText='';
function gameLoop(){
  if(gState!=='singing')return;
  if(paused){animId=requestAnimationFrame(gameLoop);return;}

  const now=performance.now();
  const rawElapsed=(now-startT-pauseAccum)/1000;
  const elapsed=rawElapsed*tempoMul;

  let songDur=curSong.dur;
  let eff=elapsed;
  if(loopStart>=0&&loopEnd>0){
    const loopLen=loopEnd-loopStart;
    if(eff>=loopEnd)eff=loopStart+((eff-loopStart)%loopLen);
    songDur=Infinity;
  }

  if(!practiceMode&&elapsed>=curSong.dur){endSong();return;}

  const prog=Math.min(1,elapsed/curSong.dur);
  document.getElementById('timerFill').style.width=(prog*100)+'%';

  const userFreq=detectPitch();

  let targetFreq=null,curNote=null;
  const mel=curSong.melody;
  for(const n of mel){
    const tf=transpose(n.f,keyShift);
    const nt=n.t/tempoMul,nd=n.d/tempoMul;
    if(eff/tempoMul>=nt&&eff/tempoMul<=nt+nd){targetFreq=tf;curNote=n;break;}
  }
  if(!curNote){
    for(const n of mel){
      if(eff>=n.t&&eff<=n.t+n.d){targetFreq=transpose(n.f,keyShift);curNote=n;break;}
    }
  }

  if(targetFreq)playSynth(targetFreq);else muteSynth();

  // Per-note scoring
  if(curNote){
    if(curNoteId!==curNote.t){
      if(curNoteId!==null&&window.KaraokeAudio){
        const res=KaraokeAudio.endNote();
        const grade=res.grade;
        let pts=0;
        if(grade==='PERFECT'){pts=100;hitN++;combo++;pitchSum+=100;rhythmSum+=100;}
        else if(grade==='GREAT'){pts=70;hitN++;combo++;pitchSum+=80;rhythmSum+=85;}
        else if(grade==='GOOD'){pts=40;hitN++;combo++;pitchSum+=55;rhythmSum+=70;}
        else{pts=0;combo=0;pitchSum+=0;rhythmSum+=20;}
        score+=pts;totalN++;
        if(combo>maxCombo)maxCombo=combo;
        const pa=document.getElementById('pitchArea');
        if(window.KaraokeFX&&pa){
          const rect=pa.getBoundingClientRect();
          KaraokeFX.judge(grade,rect.left+rect.width*0.5,rect.top+rect.height*0.55);
        }
        if(window.KaraokeFX){
          if(combo>=20&&!comboMilestones[20]){comboMilestones[20]=true;KaraokeFX.comboRing(combo);}
          else if(combo>=10&&!comboMilestones[10]){comboMilestones[10]=true;KaraokeFX.comboRing(combo);}
          else if(combo>=5&&!comboMilestones[5]){comboMilestones[5]=true;KaraokeFX.comboRing(combo);}
        }
        if(grade==='PERFECT'&&shaderOn&&window.KaraokeShader){
          KaraokeShader.setMode('perfect');
          setTimeout(()=>{if(shaderOn)KaraokeShader.setMode('singing');},350);
        }
      }
      if(targetFreq&&window.KaraokeAudio)KaraokeAudio.startNote(targetFreq,curNote.t);
      curNoteId=curNote.t;
    }
  }else if(curNoteId!==null){
    if(window.KaraokeAudio){
      const res=KaraokeAudio.endNote();
      const grade=res.grade;
      let pts=0;
      if(grade==='PERFECT'){pts=100;hitN++;combo++;pitchSum+=100;rhythmSum+=100;}
      else if(grade==='GREAT'){pts=70;hitN++;combo++;pitchSum+=80;rhythmSum+=85;}
      else if(grade==='GOOD'){pts=40;hitN++;combo++;pitchSum+=55;rhythmSum+=70;}
      else{pts=0;combo=0;pitchSum+=0;rhythmSum+=20;}
      score+=pts;totalN++;
      if(combo>maxCombo)maxCombo=combo;
      const pa=document.getElementById('pitchArea');
      if(window.KaraokeFX&&pa){
        const rect=pa.getBoundingClientRect();
        KaraokeFX.judge(grade,rect.left+rect.width*0.5,rect.top+rect.height*0.55);
      }
      if(window.KaraokeFX){
        if(combo>=20&&!comboMilestones[20]){comboMilestones[20]=true;KaraokeFX.comboRing(combo);}
        else if(combo>=10&&!comboMilestones[10]){comboMilestones[10]=true;KaraokeFX.comboRing(combo);}
        else if(combo>=5&&!comboMilestones[5]){comboMilestones[5]=true;KaraokeFX.comboRing(combo);}
      }
    }
    curNoteId=null;
  }

  // Shader audio reactivity
  if(shaderOn&&window.KaraokeShader&&window.KaraokeAudio){
    const rmsVal=KaraokeAudio.getRMS();
    const centVal=Math.min(1,KaraokeAudio.getSpectralCentroid()/4000);
    beatPulse*=0.9; if(rmsVal>0.05) beatPulse=1;
    KaraokeShader.setAudio(rmsVal,centVal,beatPulse);
    KaraokeShader.setCombo(combo);
    KaraokeShader.render(performance.now()/1000);
  }

  const fs=totalN>0?Math.min(100,Math.round(score/Math.max(1,totalN))):0;
  document.getElementById('sDisp').textContent=fs;
  document.getElementById('cDisp').textContent=combo>1?combo+' 콤보!':'';
  document.getElementById('pNote').textContent=userFreq?freqToNote(userFreq):'---';

  let curLI=-1;
  for(let i=curSong.lyrics.length-1;i>=0;i--){if(eff>=curSong.lyrics[i].t){curLI=i;break;}}

  const mH=document.getElementById('pitchMeter').clientHeight;
  if(targetFreq){const tp=Math.max(0,Math.min(1,1-(Math.log2(targetFreq/100)/3.5)));document.querySelector('.mt').style.top=(tp*(mH-20))+'px';}
  if(userFreq){const up=Math.max(0,Math.min(1,1-(Math.log2(userFreq/100)/3.5)));document.querySelector('.mu').style.top=(up*(mH-6))+'px';document.querySelector('.mu').style.display='block';}
  else{document.querySelector('.mu').style.display='none';}

  if(curLI>=0){
    const lyricObj=curSong.lyrics[curLI];
    const nextT=curLI+1<curSong.lyrics.length?curSong.lyrics[curLI+1].t:curSong.dur;
    const lyricNotes=mel.filter(n=>n.t>=lyricObj.t&&n.t<nextT);
    let html='';
    lyricNotes.forEach((n,i)=>{
      const isSung=eff>=n.t+n.d;
      const isAct=eff>=n.t&&eff<n.t+n.d;
      const cls=isAct?'active':isSung?'sung':'';
      html+='<span class="syl '+cls+'">'+(n.s||'')+'</span>';
    });
    if(!html)html='<span>'+lyricObj.tx+'</span>';
    document.getElementById('curLyric').innerHTML=html;
    const nI=curLI+1;
    document.getElementById('nxtLyric').textContent=nI<curSong.lyrics.length?curSong.lyrics[nI].tx:'';
    const lyricProg=Math.min(1,(eff-lyricObj.t)/(nextT-lyricObj.t));
    document.getElementById('lyricProg').style.width=(lyricProg*100)+'%';

    if(curLI>0&&!lineScores[curLI-1]){
      const lsc=fs;
      lineScores[curLI-1]=true;
      let fbText='',fbColor='';
      if(lsc>=90){fbText='Perfect!';fbColor='#ffd700';spawnFireworks(document.getElementById('particleCanvas'));}
      else if(lsc>=70){fbText='Great!';fbColor='#4caf50';}
      else if(lsc>=50){fbText='Good';fbColor='#2196f3';}
      else{fbText='Miss';fbColor='#f44336';}
      const fb=document.getElementById('lineFb');fb.textContent=fbText;fb.style.color=fbColor;
      lastLineFbTime=now;lastLineFbText=fbText;
    }
  }
  if(now-lastLineFbTime>1500)document.getElementById('lineFb').textContent='';

  // Debug panel
  if(window.__dbgOn){
    const dbg=window.KaraokeAudio;
    const r=dbg&&dbg.getLastDetection?dbg.getLastDetection():null;
    document.getElementById('dbgFreq').textContent=userFreq?userFreq.toFixed(1):'-';
    document.getElementById('dbgNote').textContent=userFreq?freqToNote(userFreq):'-';
    document.getElementById('dbgCents').textContent=(targetFreq&&userFreq)?(1200*Math.log2(userFreq/targetFreq)).toFixed(0):'-';
    document.getElementById('dbgClarity').textContent=r&&r.clarity!=null?r.clarity.toFixed(2):'-';
    document.getElementById('dbgRMS').textContent=dbg&&dbg.getRMS?dbg.getRMS().toFixed(3):'-';
    if(!window.__fpsLast)window.__fpsLast={t:performance.now(),c:0,fps:0};
    const fl=window.__fpsLast;fl.c++;
    const dt=performance.now()-fl.t;
    if(dt>=500){fl.fps=(fl.c*1000/dt).toFixed(0);fl.c=0;fl.t=performance.now();}
    document.getElementById('dbgFps').textContent=fl.fps;
  }

  drawPitch(eff,userFreq,targetFreq);
  drawParticles();

  const pa=document.getElementById('pitchArea');
  if(combo>=10)pa.style.boxShadow='inset 0 0 60px rgba(255,215,0,.15)';
  else if(combo>=5)pa.style.boxShadow='inset 0 0 40px rgba(76,175,80,.1)';
  else pa.style.boxShadow='none';

  if(userFreq)userPH.push({t:eff,f:userFreq});
  while(userPH.length>0&&userPH[0].t<eff-10)userPH.shift();

  animId=requestAnimationFrame(gameLoop);
}

// ===================== DRAW PITCH CANVAS =====================
function drawPitch(elapsed,userFreq,targetFreq){
  const c=document.getElementById('pitchCanvas'),ctx=c.getContext('2d');
  const W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
  const minL=Math.log2(130),maxL=Math.log2(800);
  const freqToY=f=>H-((Math.log2(f)-minL)/(maxL-minL))*H;

  const noteFreqs=[C3,D3,E3,F3,G3,A3,B3,C4,D4,E4,F4,G4,A4,B4,C5,D5,E5];
  const noteNames2=["C3","D3","E3","F3","G3","A3","B3","C4","D4","E4","F4","G4","A4","B4","C5","D5","E5"];
  ctx.lineWidth=1;ctx.font='9px sans-serif';
  noteFreqs.forEach((f,i)=>{
    const y=freqToY(f);if(y<0||y>H)return;
    ctx.strokeStyle=f===C4||f===C5?'rgba(255,255,255,.12)':'rgba(255,255,255,.04)';
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillText(noteNames2[i],3,y-2);
  });

  const wS=elapsed-2,wE=elapsed+5;
  const tX=t=>((t-wS)/(wE-wS))*W;

  const nowX=tX(elapsed);
  ctx.strokeStyle='rgba(255,106,176,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(nowX,0);ctx.lineTo(nowX,H);ctx.stroke();

  curSong.melody.forEach(n=>{
    const tf=transpose(n.f,keyShift);
    if(n.t+n.d<wS||n.t>wE)return;
    const x=tX(n.t),x2=tX(n.t+n.d),y=freqToY(tf);
    const past=elapsed>n.t+n.d,cur=elapsed>=n.t&&elapsed<=n.t+n.d;
    const bH=12;
    ctx.fillStyle=cur?'rgba(76,175,80,.5)':past?'rgba(100,100,100,.25)':'rgba(106,58,170,.45)';
    ctx.strokeStyle=cur?'#4caf50':past?'#555':'#8855cc';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(x,y-bH/2,Math.max(3,x2-x),bH,3);ctx.fill();ctx.stroke();
    if(showNoteNames&&!past){
      ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='9px sans-serif';
      ctx.fillText(freqToNote(tf),x+2,y-bH/2-2);
    }
    if(n.s&&!past){
      ctx.fillStyle=cur?'#fff':'rgba(255,255,255,.5)';ctx.font=cur?'bold 11px sans-serif':'10px sans-serif';
      ctx.fillText(n.s,x+2,y+bH/2+10);
    }
  });

  if(userPH.length>1){
    ctx.strokeStyle='#ff6ab0';ctx.lineWidth=2.5;ctx.shadowColor='rgba(255,106,176,.5)';ctx.shadowBlur=6;
    ctx.beginPath();let started=false;
    userPH.forEach(p=>{const x=tX(p.t),y=freqToY(p.f);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});
    ctx.stroke();ctx.shadowBlur=0;
  }

  if(userFreq){
    const bx=nowX,by=freqToY(userFreq);
    let dotColor='#f44336';
    if(targetFreq){
      const ac=Math.abs(1200*Math.log2(userFreq/targetFreq));
      if(ac<15)dotColor='#ffd700';else if(ac<50)dotColor='#4caf50';else if(ac<100)dotColor='#ff9800';
    }
    ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fillStyle=dotColor;
    ctx.shadowColor=dotColor;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
  }
}

function drawParticles(){
  const c=document.getElementById('particleCanvas'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  updateParticles(ctx);
}

// ===================== END SONG =====================
function endSong(){
  gState='result';killSynth();stopRecording();
  if(animId)cancelAnimationFrame(animId);
  if(window.KaraokeBGM)KaraokeBGM.stop();

  if(curNoteId!==null&&window.KaraokeAudio){KaraokeAudio.endNote();curNoteId=null;}

  const fs=totalN>0?Math.min(100,Math.round(score/Math.max(1,totalN))):0;
  const pitchAcc=totalN>0?Math.round(pitchSum/totalN):0;
  const rhythmAcc=totalN>0?Math.round(rhythmSum/totalN):0;
  const grade=getGrade(fs);const stars=getStars(fs);
  if(!practiceMode){
    saveHS(curSong.id,fs,grade);
    updateStats(curSong.id,fs,grade,pitchAcc,maxCombo);
  }else{
    const st=getStats();st.practiceCount=(st.practiceCount||0)+1;saveStats(st);
  }

  if(fs>=50)playApplause();
  if(grade==='S'&&window.KaraokeFX)KaraokeFX.confetti(3500);
  if(shaderOn&&window.KaraokeShader)KaraokeShader.setMode('result');

  document.getElementById('singScreen').style.display='none';
  const r=document.getElementById('resultScreen');r.style.display='flex';
  r.innerHTML=
    '<div class="res-title">'+(practiceMode?'연습 완료!':'노래 완료!')+'</div>'+
    '<div class="res-grade grade-'+grade+'">'+grade+'</div>'+
    '<div class="res-score">'+fs+'점</div>'+
    '<div class="res-stars">'+'★'.repeat(stars)+'☆'.repeat(5-stars)+'</div>'+
    '<div class="res-bars">'+
    '<div class="res-bar-row"><div class="lbl">음정</div><div class="bar"><div class="bar-fill" style="width:'+pitchAcc+'%;background:linear-gradient(90deg,#ff6ab0,#a855f7)"></div></div><div class="val">'+pitchAcc+'%</div></div>'+
    '<div class="res-bar-row"><div class="lbl">리듬</div><div class="bar"><div class="bar-fill" style="width:'+rhythmAcc+'%;background:linear-gradient(90deg,#4caf50,#2196f3)"></div></div><div class="val">'+rhythmAcc+'%</div></div>'+
    '</div>'+
    '<div class="res-detail">최대 콤보: '+maxCombo+' &middot; 히트율: '+(totalN>0?Math.round(hitN/totalN*100):0)+'%</div>'+
    '<div class="res-btns">'+
    '<button class="btn-retry" id="rRetry">다시 부르기</button>'+
    (recordedBlob?'<button class="btn-play" id="rPlay">녹음 재생</button>':'')+
    '<button class="btn-share" id="rShare">📷 공유 카드</button>'+
    '<button class="btn-back" id="rBack">곡 선택</button>'+
    '</div>';
  document.getElementById('rShare').onclick=()=>downloadShareCard();
  document.getElementById('rRetry').onclick=()=>pickSong(curSong,practiceMode);
  document.getElementById('rBack').onclick=()=>{
    gState='select';killSynth();
    if(window.KaraokeFX)KaraokeFX.cleanup();
    if(shaderOn&&window.KaraokeShader){KaraokeShader.destroy();shaderOn=false;}
    r.style.display='none';document.getElementById('singScreen').style.display='none';
    document.getElementById('songSelect').style.display='grid';
    document.getElementById('bottomNav').style.display='flex';
    renderList();
  };
  if(recordedBlob){
    document.getElementById('rPlay').onclick=()=>{const a=new Audio(URL.createObjectURL(recordedBlob));a.play();};
  }
}

function downloadShareCard(){
  const W=1080, H=1920;
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d');

  const bg = x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a1040'); bg.addColorStop(0.5,'#2a1060'); bg.addColorStop(1,'#0a0818');
  x.fillStyle=bg; x.fillRect(0,0,W,H);

  for(let i=0;i<6;i++){
    const r = 200+Math.random()*300;
    const cx = Math.random()*W, cy = Math.random()*H;
    const g = x.createRadialGradient(cx,cy,0,cx,cy,r);
    const colors = ['rgba(255,106,176,.15)','rgba(168,85,247,.15)','rgba(255,215,0,.10)'];
    g.addColorStop(0, colors[i%3]); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(0,0,W,H);
  }

  x.fillStyle='#ff6ab0'; x.textAlign='center';
  x.font='bold 64px sans-serif'; x.fillText('🎤 StarVoice v6', W/2, 200);
  x.fillStyle='rgba(255,255,255,.6)'; x.font='32px sans-serif';
  x.fillText('나의 노래방 점수', W/2, 260);

  x.fillStyle='#fff'; x.font='bold 56px sans-serif';
  const songTitle = (curSong&&curSong.title)?curSong.title:'노래';
  x.fillText(songTitle, W/2, 380);

  const fs = totalN>0?Math.min(100,Math.round(score/Math.max(1,totalN))):0;
  const grade = getGrade(fs);
  const gColors = {S:'#ffd700', A:'#4caf50', B:'#2196f3', C:'#ff9800', D:'#f44336'};
  x.fillStyle = gColors[grade]||'#fff';
  x.font='900 480px sans-serif';
  x.shadowColor=gColors[grade]||'#fff'; x.shadowBlur=80;
  x.fillText(grade, W/2, 920);
  x.shadowBlur=0;

  x.fillStyle='#ffd700'; x.font='900 240px sans-serif';
  x.fillText(fs+'점', W/2, 1180);

  const stars = getStars(fs);
  x.fillStyle='#ffd700'; x.font='100px sans-serif';
  x.fillText('★'.repeat(stars)+'☆'.repeat(5-stars), W/2, 1320);

  const pitchAcc=totalN>0?Math.round(pitchSum/totalN):0;
  const rhythmAcc=totalN>0?Math.round(rhythmSum/totalN):0;
  x.fillStyle='rgba(255,255,255,.85)'; x.font='44px sans-serif';
  x.fillText('음정 '+pitchAcc+'%   |   박자 '+rhythmAcc+'%', W/2, 1460);
  x.fillText('최고 콤보 '+(maxCombo||0), W/2, 1530);

  x.fillStyle='rgba(255,255,255,.4)'; x.font='32px sans-serif';
  const date = new Date().toLocaleDateString('ko-KR');
  x.fillText(date+' · StarVoice v6', W/2, H-100);

  c.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'StarVoice_'+songTitle+'_'+grade+'_'+fs+'점.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }, 'image/png', 0.95);
}

    const rec=hs[s.id];
    html+='<div class="hs-row"><span class="hs-name">'+s.icon+' '+s.title+'</span>';
    if(rec)html+='<span><span class="hs-sc">'+rec.s+'점</span><span class="hs-gr grade-'+rec.g+'">'+rec.g+'</span></span>';
    else html+='<span style="color:#555">기록 없음</span>';
    html+='</div>';
  });
  html+='<div style="text-align:center;margin-top:14px"><button class="btn-back" onclick="document.getElementById(\'hsModal\').classList.remove(\'show\')">닫기</button></div>';
  document.getElementById('hsBox').innerHTML=html;
};

// Scroll to top button
const songSelectEl=document.getElementById('songSelect');
songSelectEl.addEventListener('scroll',()=>{
  const st=document.getElementById('scrollTop');
  if(songSelectEl.scrollTop>300)st.classList.add('show');
  else st.classList.remove('show');
});
document.getElementById('scrollTop').onclick=()=>{songSelectEl.scrollTo({top:0,behavior:'smooth'});};

// Resize
function resizeCanvases(){
  if(gState==='singing'){
    const c=document.getElementById('pitchCanvas');c.width=c.parentElement.clientWidth;c.height=c.parentElement.clientHeight;
    const pc=document.getElementById('particleCanvas');pc.width=pc.parentElement.clientWidth;pc.height=pc.parentElement.clientHeight;
    if(shaderOn&&window.KaraokeShader)KaraokeShader.resize();
  }
}
window.addEventListener('resize',resizeCanvases);

// ===================== INIT =====================
renderList();

// Triple-tap debug panel
(function(){
  let taps=[],el=null;
  function setup(){
    el=document.querySelector('#header h1');
    if(!el){setTimeout(setup,100);return;}
    el.addEventListener('click',()=>{
      const now=Date.now();
      taps=taps.filter(t=>now-t<700);
      taps.push(now);
      if(taps.length>=3){
        window.__dbgOn=!window.__dbgOn;
        const p=document.getElementById('dbgPanel');
        if(p)p.style.display=window.__dbgOn?'block':'none';
        taps=[];
        console.log('[v5] debug panel:',window.__dbgOn?'ON':'OFF');
      }
    });
  }
  setup();
})();

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&gState==='select'&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();
    const si=document.getElementById('searchInput');
    if(si)si.focus();
  }
  if(e.key==='Escape'){
    if(document.activeElement.tagName==='INPUT')document.activeElement.blur();
    document.getElementById('warmupModal').classList.remove('show');
    document.getElementById('practiceModal').classList.remove('show');
    document.getElementById('hsModal').classList.remove('show');
  }
});

// Service worker registration
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
