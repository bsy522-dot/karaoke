<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>StarVoice v6 - 노래방</title>
<style>
/* ===== CSS Variables for Dark/Light theme ===== */
:root{
--bg-primary:#0a0818;--bg-secondary:#1a1040;--bg-tertiary:#2a1060;
--text-primary:#eee;--text-secondary:#aaa;--text-muted:#888;
--accent:#ff6ab0;--accent2:#a855f7;--accent-gold:#ffd700;
--card-bg:linear-gradient(135deg,rgba(40,20,80,.8),rgba(60,30,100,.6));
--card-border:rgba(255,106,176,.15);--card-hover:#ff6ab0;
--header-bg:linear-gradient(135deg,#1a1040,#2a1060);--header-border:#6a3aaa;
--lyrics-bg:linear-gradient(180deg,rgba(30,15,60,.95),rgba(20,10,40,.98));
--modal-bg:rgba(0,0,0,.85);--modal-box-bg:linear-gradient(135deg,#1a1040,#2a1060);
--scrollbar:#555;--pitch-bg:linear-gradient(180deg,#0a0818,#15102a);
--search-bg:rgba(255,255,255,.08);--search-border:rgba(255,255,255,.15);
--btn-bg:rgba(255,255,255,.1);--btn-border:rgba(255,255,255,.2);
}
[data-theme="light"]{
--bg-primary:#f0f0f5;--bg-secondary:#e8e0f0;--bg-tertiary:#d8d0e8;
--text-primary:#222;--text-secondary:#666;--text-muted:#999;
--accent:#d4408a;--accent2:#7c3aed;--accent-gold:#b8860b;
--card-bg:linear-gradient(135deg,rgba(230,220,245,.9),rgba(240,230,250,.85));
--card-border:rgba(124,58,237,.2);--card-hover:#d4408a;
--header-bg:linear-gradient(135deg,#e8e0f0,#d8d0e8);--header-border:#a888dd;
--lyrics-bg:linear-gradient(180deg,rgba(230,220,245,.97),rgba(240,230,250,.98));
--modal-bg:rgba(255,255,255,.9);--modal-box-bg:linear-gradient(135deg,#f0e8f8,#e8e0f0);
--scrollbar:#bbb;--pitch-bg:linear-gradient(180deg,#e8e0f0,#d8d0e8);
--search-bg:rgba(0,0,0,.05);--search-border:rgba(0,0,0,.15);
--btn-bg:rgba(0,0,0,.06);--btn-border:rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
body{background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden;height:100vh;user-select:none}
#app{height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}

/* Header */
#header{background:var(--header-bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--header-border);flex-shrink:0;z-index:10}
#header h1{font-size:20px;color:var(--accent);text-shadow:0 0 20px rgba(255,106,176,.5)}
.hdr-left{display:flex;align-items:center;gap:8px}
.song-count-badge{background:var(--accent2);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap}
.hdr-btns button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text-primary);padding:5px 12px;border-radius:18px;font-size:12px;transition:all .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.hdr-btns button:hover,.hdr-btns button.active{background:rgba(255,106,176,.3);border-color:var(--accent)}

/* Search */
.search-wrap{grid-column:1/-1;position:relative;margin-bottom:4px}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;background:var(--search-bg);border:1px solid var(--search-border);border-radius:12px;color:var(--text-primary);font-size:14px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted);pointer-events:none}

/* Favorites filter */
.fav-filter{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.fav-filter button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text-primary);padding:5px 14px;border-radius:16px;font-size:12px;transition:all .2s}
.fav-filter button.active{background:rgba(255,106,176,.3);border-color:var(--accent);color:var(--accent)}

/* Recently played */
.recent-section{grid-column:1/-1;margin-bottom:8px}
.recent-section h4{font-size:13px;color:var(--accent2);margin-bottom:6px}
.recent-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.recent-scroll::-webkit-scrollbar{height:4px}
.recent-card{flex-shrink:0;width:140px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;cursor:pointer;transition:all .2s}
.recent-card:hover{border-color:var(--accent)}
.recent-card .rc-icon{font-size:20px}
.recent-card .rc-title{font-size:12px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Song Select */
#songSelect{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-content:start}
.cat-header{grid-column:1/-1;font-size:14px;font-weight:700;color:var(--accent2);margin:8px 0 2px;padding-left:4px;border-left:3px solid var(--accent2)}
.song-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:14px;padding:14px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;min-height:0;animation:card-enter .4s ease-out both}
.song-card:hover{border-color:var(--card-hover);transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,106,176,.2)}
.song-card .sc-icon{font-size:32px;float:left;margin-right:10px;flex-shrink:0}
.song-card .sc-title{font-size:15px;font-weight:700;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-card .sc-info{font-size:11px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-card .sc-stars{color:var(--accent-gold);font-size:13px;margin-top:4px}
.song-card .sc-high{font-size:10px;color:#8f8;margin-top:2px}
.song-card .sc-grade{position:absolute;top:8px;right:10px;font-size:20px;font-weight:900;opacity:.3}
.song-card .fav-btn{position:absolute;top:8px;right:36px;font-size:18px;background:none;border:none;cursor:pointer;opacity:.5;transition:opacity .2s;padding:0}
.song-card .fav-btn:hover,.song-card .fav-btn.fav-active{opacity:1}
.diff-badge{position:absolute;bottom:8px;right:10px;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.diff-easy{background:#4caf50;color:#fff}.diff-medium{background:#ff9800;color:#fff}.diff-hard{background:#f44336;color:#fff}

@keyframes card-enter{
0%{opacity:0;transform:translateY(20px) scale(.97)}
100%{opacity:1;transform:translateY(0) scale(1)}
}

/* Sing Screen */
#singScreen{flex:1;display:none;flex-direction:column;position:relative}
#pitchArea{flex:1;position:relative;background:var(--pitch-bg);overflow:hidden}
#shaderCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#pitchCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
#particleCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* Lyrics */
#lyricsArea{height:120px;background:var(--lyrics-bg);border-top:2px solid var(--header-border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;flex-shrink:0}
#lyricsArea .cur-lyric{font-size:26px;font-weight:900;color:var(--text-primary);text-align:center;text-shadow:0 0 20px rgba(255,106,176,.6);min-height:34px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
#lyricsArea .cur-lyric .syl{transition:color .15s,transform .15s;display:inline-block}
#lyricsArea .cur-lyric .syl.sung{color:var(--accent-gold);transform:scale(1.15)}
#lyricsArea .cur-lyric .syl.active{color:var(--accent);transform:scale(1.2)}
#lyricsArea .nxt-lyric{font-size:14px;color:rgba(255,255,255,.3);text-align:center;margin-top:6px;min-height:20px}
.lyric-prog{width:80%;max-width:500px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:8px;overflow:hidden}
.lyric-prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .1s linear}

/* Score HUD */
#scoreHUD{position:absolute;top:8px;right:12px;text-align:right;z-index:5}
#scoreHUD .sv{font-size:32px;font-weight:900;color:var(--accent-gold);text-shadow:0 0 12px rgba(255,215,0,.5)}
#scoreHUD .cv{font-size:13px;color:#8f8}
#scoreHUD .pn{font-size:12px;color:var(--text-secondary);margin-top:2px}
#scoreHUD .line-fb{font-size:11px;margin-top:4px;font-weight:700;min-height:16px}

/* Pitch Meter */
#pitchMeter{position:absolute;left:10px;top:8px;bottom:8px;width:36px;background:rgba(255,255,255,.04);border-radius:6px;z-index:5;overflow:hidden}
#pitchMeter .mt{position:absolute;left:0;width:100%;height:20px;background:rgba(76,175,80,.25);border:2px solid #4caf50;border-radius:3px;transition:top .12s}
#pitchMeter .mu{position:absolute;left:0;width:100%;height:6px;background:var(--accent);border-radius:3px;transition:top .06s;box-shadow:0 0 8px rgba(255,106,176,.6)}
#pitchMeter .ml{position:absolute;bottom:3px;width:100%;text-align:center;font-size:8px;color:var(--text-muted)}

/* Timer */
#timerBar{position:absolute;top:0;left:0;right:0;height:3px;z-index:5}
#timerFill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s linear}

/* Controls overlay */
#singControls{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6;opacity:.7;transition:opacity .2s}
#singControls:hover{opacity:1}
#singControls button{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
#singControls button.active{background:rgba(255,106,176,.4);border-color:var(--accent)}

/* Result */
#resultScreen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;overflow-y:auto}
.res-title{font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px}
.res-grade{font-size:80px;font-weight:900;margin:8px 0}
.grade-S{color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.6)}.grade-A{color:#4caf50;text-shadow:0 0 30px rgba(76,175,80,.5)}
.grade-B{color:#2196f3}.grade-C{color:#ff9800}.grade-D{color:#f44336}
.res-score{font-size:48px;font-weight:900;color:var(--accent-gold);text-shadow:0 0 20px rgba(255,215,0,.4)}
.res-stars{font-size:36px;margin:10px 0}
.res-detail{font-size:13px;color:var(--text-secondary);margin-bottom:6px;line-height:1.8}
.res-bars{width:280px;margin:10px auto}
.res-bar-row{display:flex;align-items:center;margin:4px 0;font-size:12px}
.res-bar-row .lbl{width:60px;text-align:right;margin-right:8px;color:#ccc}
.res-bar-row .bar{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.res-bar-row .bar-fill{height:100%;border-radius:5px;transition:width 1s}
.res-bar-row .val{width:36px;text-align:right;margin-left:6px;color:var(--text-primary);font-weight:700}
.res-btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.res-btns button{padding:10px 24px;border:none;border-radius:20px;font-size:14px;font-weight:700;transition:all .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-retry{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-back{background:var(--btn-bg);color:var(--text-primary);border:1px solid var(--btn-border)!important}
.btn-play{background:rgba(76,175,80,.3);color:#8f8;border:1px solid rgba(76,175,80,.4)!important}
.btn-share{background:linear-gradient(135deg,var(--accent2),#6366f1);color:#fff}

/* Practice Modal */
#practiceModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#practiceModal.show{display:flex}
.pm-box{background:var(--modal-box-bg);border:2px solid var(--header-border);border-radius:16px;padding:24px;max-width:360px;width:100%}
.pm-box h3{color:var(--accent);margin-bottom:16px;font-size:18px}
.pm-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:14px}
.pm-row label{color:#ccc}
.pm-row input[type=range]{width:120px;accent-color:var(--accent)}
.pm-row select{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--header-border);border-radius:6px;padding:4px 8px;font-size:13px}
.pm-row .val{color:var(--accent);font-weight:700;width:40px;text-align:right}
.pm-btns{display:flex;gap:8px;margin-top:16px;justify-content:center}
.pm-btns button{padding:8px 20px;border:none;border-radius:16px;font-size:13px;font-weight:700}

/* Mic Prompt */
#micPrompt{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:100;flex-direction:column;align-items:center;justify-content:center}
#micPrompt.show{display:flex}
#micPrompt .mi{font-size:56px;margin-bottom:14px}
#micPrompt p{font-size:16px;color:#ccc;margin-bottom:16px;text-align:center;line-height:1.6;padding:0 20px}
#micPrompt button{padding:12px 32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;border-radius:24px;font-size:15px;font-weight:700}
#micPrompt .skip-btn{background:transparent;color:#888;font-size:13px;margin-top:10px;border:none;text-decoration:underline}

/* High Score Modal */
#hsModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#hsModal.show{display:flex}
.hs-box{background:var(--modal-box-bg);border:2px solid var(--header-border);border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:70vh;overflow-y:auto}
.hs-box h3{color:var(--accent);margin-bottom:12px}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.hs-row .hs-name{color:var(--text-primary)}.hs-row .hs-sc{color:var(--accent-gold);font-weight:700}
.hs-row .hs-gr{font-weight:900;margin-left:6px}

/* Warm-up Modal */
#warmupModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-bg);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#warmupModal.show{display:flex}
.wu-box{background:var(--modal-box-bg);border:2px solid var(--header-border);border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.wu-box h3{color:var(--accent);margin-bottom:16px;font-size:18px}
.wu-exercise{background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;transition:all .2s}
.wu-exercise:hover{border-color:var(--accent);transform:translateX(4px)}
.wu-exercise .wu-name{font-weight:700;font-size:14px;color:var(--text-primary)}
.wu-exercise .wu-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
.wu-active-area{text-align:center;margin-top:16px}
.wu-pitch-display{font-size:48px;font-weight:900;color:var(--accent-gold);margin:12px 0}
.wu-target{font-size:14px;color:var(--text-secondary)}
.wu-progress{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin:10px 0;overflow:hidden}
.wu-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .2s}
.wu-score{font-size:20px;font-weight:700;color:var(--accent-gold);margin:8px 0}

/* Scroll to top */
#scrollTop{display:none;position:fixed;bottom:70px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;z-index:40;box-shadow:0 4px 12px rgba(255,106,176,.4);cursor:pointer;transition:opacity .2s}
#scrollTop.show{display:flex;align-items:center;justify-content:center}

/* Bottom Tab Bar */
#bottomNav{display:flex;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--header-bg);border-top:2px solid var(--header-border);z-index:45;padding:0;margin:0}
#bottomNav button{flex:1;background:none;border:none;color:var(--text-muted);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:color .2s;padding:0}
#bottomNav button .nav-icon{font-size:20px}
#bottomNav button.active{color:var(--accent)}
#app{padding-bottom:56px}

/* Difficulty Filter Tabs */
.diff-tabs{grid-column:1/-1;display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.diff-tabs button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text-primary);padding:5px 14px;border-radius:16px;font-size:12px;transition:all .2s}
.diff-tabs button.active{background:rgba(255,106,176,.3);border-color:var(--accent);color:var(--accent)}

/* Sort Controls */
.sort-wrap{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.sort-wrap select{background:var(--search-bg);border:1px solid var(--search-border);color:var(--text-primary);padding:5px 10px;border-radius:10px;font-size:12px;outline:none}

/* Today Pick */
.today-pick{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,106,176,.15),rgba(168,85,247,.15));border:2px solid rgba(255,106,176,.3);border-radius:16px;padding:16px;margin-bottom:8px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.today-pick:hover{border-color:var(--accent);transform:scale(1.01)}
.today-pick .tp-badge{position:absolute;top:10px;right:12px;background:var(--accent);color:#fff;font-size:10px;padding:3px 10px;border-radius:10px;font-weight:700}
.today-pick .tp-title{font-size:18px;font-weight:900;color:var(--text-primary)}
.today-pick .tp-sub{font-size:12px;color:var(--text-secondary);margin-top:4px}

/* Statistics Panel */
#statsPanel{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:12px}
.stat-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:14px;padding:16px}
.stat-card h4{color:var(--accent);margin-bottom:10px;font-size:14px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-item{text-align:center;padding:10px;background:var(--btn-bg);border-radius:10px}
.stat-item .si-val{font-size:24px;font-weight:900;color:var(--accent-gold)}
.stat-item .si-lbl{font-size:11px;color:var(--text-secondary);margin-top:4px}
.stat-range{margin-top:10px}
.stat-range .sr-bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.stat-range .sr-bar .sr-fill{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.stat-range .sr-bar .sr-fill div{height:100%;border-radius:4px;transition:width .5s}

/* Achievement Panel */
#achievePanel{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:8px}
.ach-card{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:2px solid var(--card-border);border-radius:14px;padding:14px;transition:all .3s}
.ach-card.unlocked{border-color:var(--accent-gold);box-shadow:0 0 16px rgba(255,215,0,.1)}
.ach-card .ach-icon{font-size:32px;flex-shrink:0;filter:grayscale(1) opacity(.4)}
.ach-card.unlocked .ach-icon{filter:none}
.ach-card .ach-info{flex:1}
.ach-card .ach-name{font-size:14px;font-weight:700;color:var(--text-primary)}
.ach-card .ach-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
.ach-card .ach-date{font-size:10px;color:var(--accent-gold);margin-top:2px}

/* Achievement Toast */
.ach-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,rgba(255,215,0,.95),rgba(255,165,0,.95));color:#1a1040;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:700;z-index:200;box-shadow:0 8px 32px rgba(255,215,0,.4);transition:transform .4s ease;white-space:nowrap}

<style>
/* =====================================================================
   KaraokeFX - VFX Stylesheet (pure CSS, mobile-responsive)
   Pairs with vfx_effects.js (window.KaraokeFX)
   ===================================================================== */

/* ---------- Layer container ---------- */
.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

/* ---------- Confetti canvas ---------- */
.fx-confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* =====================================================================
   Keyframes
   ===================================================================== */
@keyframes float-up-fade {
  0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
  20%  { transform: translate(-50%, -10px) scale(1.15); opacity: 1; }
  60%  { transform: translate(-50%, -32px) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -64px) scale(0.9); opacity: 0; }
}

@keyframes ring-pulse {
  0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0.9; }
  60%  { opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(var(--combo-scale, 2)); opacity: 0; }
}

@keyframes syllable-bounce {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-18%) scale(1.18); }
  70%  { transform: translateY(0) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes screen-flash {
  0%   { opacity: 0; }
  30%  { opacity: 0.45; }
  100% { opacity: 0; }
}

@keyframes perfect-glow {
  0%   { filter: drop-shadow(0 0 0 #fff8); transform: rotate(0deg) scale(0.6); }
  35%  { filter: drop-shadow(0 0 18px #FFD93D); transform: rotate(45deg) scale(1.2); }
  100% { filter: drop-shadow(0 0 8px #FFD93D); transform: rotate(90deg) scale(1); }
}

@keyframes burst-out {
  0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(0.4); opacity: 0; }
}

@keyframes pop-in {
  0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  50%  { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@keyframes fade-icon {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}

/* =====================================================================
   Judgment burst container
   ===================================================================== */
.fx-judge {
  position: absolute;
  width: clamp(80px, 14vw, 140px);
  height: clamp(80px, 14vw, 140px);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

.fx-judge svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both,
             fade-icon 0.85s ease-out both;
}

.fx-judge-text {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translate(-50%, 0);
  font-weight: 900;
  font-size: clamp(18px, 3.6vw, 32px);
  letter-spacing: 1px;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 12px currentColor;
  animation: float-up-fade 0.85s ease-out both;
  white-space: nowrap;
}

/* Variant tints */
.fx-judge-perfect svg { animation: perfect-glow 0.6s ease-out both, fade-icon 0.85s ease-out both; }
.fx-judge-perfect .fx-judge-text { font-size: clamp(22px, 4.4vw, 40px); }
.fx-judge-great   svg { filter: drop-shadow(0 0 8px #6BCB77aa); }
.fx-judge-good    svg { filter: drop-shadow(0 0 6px #4D96FFaa); }
.fx-judge-miss    svg { filter: drop-shadow(0 0 4px #FF6B6Baa); opacity: 0.85; }
.fx-judge-miss    .fx-judge-text { font-size: clamp(16px, 3vw, 26px); opacity: 0.9; }

/* =====================================================================
   Particle ring (judge bursts)
   ===================================================================== */
.fx-particle {
  position: absolute;
  width: clamp(6px, 1vw, 10px);
  height: clamp(6px, 1vw, 10px);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: burst-out 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
  box-shadow: 0 0 8px currentColor;
}

/* =====================================================================
   Screen flash (PERFECT)
   ===================================================================== */
.fx-screen-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, #FFD93D88 0%, transparent 70%);
  animation: screen-flash 0.18s ease-out both;
  pointer-events: none;
}

/* =====================================================================
   Combo pulse ring
   ===================================================================== */
.fx-combo-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(80px, 12vw, 140px);
  height: clamp(80px, 12vw, 140px);
  border-radius: 50%;
  border: 4px solid #FFD93D;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: ring-pulse 0.8s ease-out both;
  box-shadow: 0 0 16px #FFD93D88, inset 0 0 16px #FFD93D44;
}

.fx-combo-lo  { border-color: #4D96FF; box-shadow: 0 0 14px #4D96FF99, inset 0 0 14px #4D96FF44; }
.fx-combo-mid { border-color: #6BCB77; box-shadow: 0 0 18px #6BCB77aa, inset 0 0 18px #6BCB7755; }
.fx-combo-hi  { border-color: #FFD93D; border-width: 6px; box-shadow: 0 0 32px #FFD93D, inset 0 0 24px #FFD93Daa; }

/* =====================================================================
   Lyrics syllable bounce
   ===================================================================== */
.fx-syllable-bounce {
  display: inline-block;
  animation: syllable-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  transform-origin: 50% 100%;
  color: #FFD93D;
  text-shadow: 0 2px 8px #FFD93D88, 0 0 4px #fff;
}

/* =====================================================================
   Reduced motion fallback
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {
  .fx-judge svg,
  .fx-judge-text,
  .fx-particle,
  .fx-combo-ring,
  .fx-syllable-bounce,
  .fx-screen-flash {
    animation-duration: 0.1s !important;
    animation-iteration-count: 1 !important;
  }
}

/* =====================================================================
   Mobile tweaks
   ===================================================================== */
@media (max-width: 480px) {
  .fx-judge { width: clamp(60px, 22vw, 100px); height: clamp(60px, 22vw, 100px); }
  .fx-judge-text { font-size: clamp(16px, 5vw, 24px); }
  .fx-combo-ring { width: clamp(60px, 22vw, 110px); height: clamp(60px, 22vw, 110px); }
}

/* =====================================================================
   Compose hooks for v3 host elements
   ===================================================================== */
#pitchArea .fx-syllable-bounce {
  will-change: transform;
}

#particleCanvas + .fx-confetti-canvas {
  z-index: 1;
}

/* Stage glow helper */
.fx-stage-pulse {
  animation: stage-pulse 1.4s ease-in-out infinite;
}

@keyframes stage-pulse {
  0%, 100% { box-shadow: inset 0 0 30px 4px rgba(255, 217, 61, 0.4); }
  50%      { box-shadow: inset 0 0 60px 14px rgba(255, 217, 61, 0.8); }
}

/* SVG icon defaults */
.fx-star-svg,
.fx-check-svg,
.fx-circle-svg,
.fx-x-svg {
  display: block;
  overflow: visible;
}
</style>

<script>
/* KaraokeAudio v4 — robust pitch engine
 * Implements McLeod Pitch Method (NSDF) inline + octave correction + median filter
 * + per-note scoring + user-range estimation. Pure vanilla browser. No imports.
 */
(function (global) {
  'use strict';

  var ctx = null;
  var ana = null;
  var BUF = 2048;
  var buf = null;
  var freqBuf = null;
  var freqHist = [];
  var medianWin = [];
  var note = null;
  var rangeStartT = 0;
  var rangeFreqs = [];
  var rangeDoneAt = 0;
  var lastRMS = 0;
  var lastCentroid = 0;
  var lastFlatness = 0;
  var _lastDetection = null;

  function init(audioCtx, analyserNode, bufSize) {
    ctx = audioCtx;
    ana = analyserNode;
    BUF = bufSize || 2048;
    buf = new Float32Array(BUF);
    freqBuf = new Float32Array(ana ? ana.frequencyBinCount : BUF / 2);
    resetSession();
    rangeStartT = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    rangeDoneAt = 0;
    rangeFreqs = [];
  }

  function resetSession() {
    freqHist = [];
    medianWin = [];
    note = null;
  }

  function nsdf(x) {
    var n = x.length;
    var half = n >> 1;
    var out = new Float32Array(half);
    for (var t = 0; t < half; t++) {
      var ac = 0, m = 0;
      for (var j = 0; j < n - t; j++) {
        var a = x[j], b = x[j + t];
        ac += a * b;
        m += a * a + b * b;
      }
      out[t] = m > 0 ? (2 * ac) / m : 0;
    }
    return out;
  }

  function pickPeak(ns) {
    var n = ns.length;
    var i = 1;
    while (i < n - 1 && ns[i] > 0) i++;
    while (i < n - 1 && ns[i] <= 0) i++;
    if (i >= n - 1) return -1;
    var peakIdx = -1, peakVal = -1;
    for (; i < n - 1; i++) {
      if (ns[i] > ns[i - 1] && ns[i] >= ns[i + 1] && ns[i] > peakVal) {
        peakVal = ns[i];
        peakIdx = i;
      }
    }
    return peakIdx;
  }

  function parabolic(a, k) {
    if (k <= 0 || k >= a.length - 1) return { x: k, y: a[k] };
    var l = a[k - 1], c = a[k], r = a[k + 1];
    var denom = (l - 2 * c + r);
    var dx = denom !== 0 ? 0.5 * (l - r) / denom : 0;
    if (!isFinite(dx) || dx > 1 || dx < -1) dx = 0;
    var y = c - 0.25 * (l - r) * dx;
    return { x: k + dx, y: y };
  }

  function computeRMS(x) {
    var s = 0;
    for (var i = 0; i < x.length; i++) s += x[i] * x[i];
    return Math.sqrt(s / x.length);
  }

  function computeFlatnessAndCentroid() {
    if (!ana || !freqBuf) return { flat: 0, cent: 0 };
    ana.getFloatFrequencyData(freqBuf);
    var n = freqBuf.length;
    var mags = new Float32Array(n);
    var sumMag = 0, logSum = 0, valid = 0;
    var sr = ctx ? ctx.sampleRate : 44100;
    var binHz = sr / 2 / n;
    var weighted = 0;
    for (var i = 1; i < n; i++) {
      var db = freqBuf[i];
      if (db < -120) db = -120;
      var lin = Math.pow(10, db / 20);
      mags[i] = lin;
      sumMag += lin;
      weighted += lin * (i * binHz);
      if (lin > 1e-10) { logSum += Math.log(lin); valid++; }
    }
    var flat = 0;
    if (valid > 0 && sumMag > 0) {
      var geo = Math.exp(logSum / valid);
      var arith = sumMag / (n - 1);
      flat = arith > 0 ? geo / arith : 0;
    }
    var cent = sumMag > 0 ? weighted / sumMag : 0;
    return { flat: flat, cent: cent };
  }

  function trimHist(now) {
    var cutoff = now - 200;
    while (freqHist.length && freqHist[0].t < cutoff) freqHist.shift();
  }

  function octaveCorrect(f, now) {
    trimHist(now);
    if (!freqHist.length) return f;
    var s = 0;
    for (var i = 0; i < freqHist.length; i++) s += Math.log(freqHist[i].f);
    var mean = Math.exp(s / freqHist.length);
    var d0 = Math.abs(1200 * Math.log2(f / mean));
    if (d0 <= 600) return f;
    var fUp = f * 2, fDn = f / 2;
    var dUp = Math.abs(1200 * Math.log2(fUp / mean));
    var dDn = Math.abs(1200 * Math.log2(fDn / mean));
    var best = f, bd = d0;
    if (dUp < bd) { best = fUp; bd = dUp; }
    if (dDn < bd) { best = fDn; bd = dDn; }
    return best;
  }

  function medianFilter(f) {
    medianWin.push(f);
    if (medianWin.length > 5) medianWin.shift();
    var sorted = medianWin.slice().sort(function (a, b) { return a - b; });
    return sorted[Math.floor(sorted.length / 2)];
  }

  function detectPitch() {
    if (!ctx || !ana || !buf) { _lastDetection = null; return null; }
    ana.getFloatTimeDomainData(buf);
    var sm = computeFlatnessAndCentroid();
    lastFlatness = sm.flat;
    lastCentroid = sm.cent;
    var rms = computeRMS(buf);
    lastRMS = rms;
    var voiced = (rms > 0.018) && (sm.flat < 0.5);
    if (!voiced) { _lastDetection = null; return null; }
    var ns = nsdf(buf);
    var k = pickPeak(ns);
    if (k < 2) { _lastDetection = null; return null; }
    var clarity = ns[k];
    if (clarity < 0.85) { _lastDetection = { freq: 0, clarity: clarity, voiced: false }; return null; }
    var refined = parabolic(ns, k);
    var lag = refined.x;
    if (lag <= 0) { _lastDetection = null; return null; }
    var freq = ctx.sampleRate / lag;
    if (freq < 80 || freq > 1000) { _lastDetection = null; return null; }
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var fc = octaveCorrect(freq, now);
    var fm = medianFilter(fc);
    freqHist.push({ t: now, f: fm });
    if (rangeDoneAt === 0) {
      if (now - rangeStartT <= 5000) { rangeFreqs.push(fm); }
      else { rangeDoneAt = now; }
    }
    if (note && note.target) {
      var cents = 1200 * Math.log2(fm / note.target);
      note.voiced++;
      note.centsSum += cents;
      note.framesAbs += Math.abs(cents);
    }
    if (note) note.total++;
    var _out = { freq: fm, clarity: clarity, voiced: true };
    _lastDetection = _out;
    return _out;
  }

  function startNote(targetFreq, noteId) {
    note = { target: targetFreq, id: noteId, voiced: 0, total: 0, centsSum: 0, framesAbs: 0 };
  }

  function endNote() {
    if (!note) return { avgCents: 0, hitFrames: 0, totalFrames: 0, grade: 'MISS' };
    var avgCents = note.voiced > 0 ? (note.centsSum / note.voiced) : 9999;
    var abs = Math.abs(avgCents);
    var grade;
    if (note.voiced === 0) grade = 'MISS';
    else if (abs < 25) grade = 'PERFECT';
    else if (abs < 50) grade = 'GREAT';
    else if (abs < 100) grade = 'GOOD';
    else grade = 'MISS';
    var result = { avgCents: avgCents, hitFrames: note.voiced, totalFrames: note.total, grade: grade };
    note = null;
    return result;
  }

  function estimateUserRange() {
    if (rangeFreqs.length < 5) return { meanFreq: 0, suggestedKeyShift: 0 };
    var s = 0;
    for (var i = 0; i < rangeFreqs.length; i++) s += Math.log(rangeFreqs[i]);
    var meanFreq = Math.exp(s / rangeFreqs.length);
    var anchor = 220;
    var semis = 12 * Math.log2(meanFreq / anchor);
    var candidates = [-5, -3, -2, 0, 2, 3, 5];
    var best = 0, bd = 1e9;
    for (var j = 0; j < candidates.length; j++) {
      var d = Math.abs(candidates[j] - (-semis));
      if (d < bd) { bd = d; best = candidates[j]; }
    }
    return { meanFreq: meanFreq, suggestedKeyShift: best };
  }

  function getRMS() { return lastRMS; }
  function getSpectralCentroid() { return lastCentroid; }

  global.KaraokeAudio = {
    init: init,
    detectPitch: detectPitch,
    resetSession: resetSession,
    startNote: startNote,
    endNote: endNote,
    estimateUserRange: estimateUserRange,
    getRMS: getRMS,
    getSpectralCentroid: getSpectralCentroid,
    getLastDetection: function () { return _lastDetection; }
  };
})(typeof window !== 'undefined' ? window : this);
</script>

<script>
/* KaraokeShader v4 — WebGL2 fluid k-pop background */
(function () {
  'use strict';

  const VERT_SRC = `#version 300 es
  precision highp float;
  out vec2 vUV;
  void main() {
    vec2 p = vec2((gl_VertexID & 1) * 2 - 1, (gl_VertexID & 2) - 1);
    vUV = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
  }`;

  const FRAG_SRC = `#version 300 es
  precision highp float;
  in vec2 vUV;
  out vec4 fragColor;
  uniform vec2  uResolution;
  uniform float uTime;
  uniform float uRMS;
  uniform float uCentroid;
  uniform float uBeat;
  uniform float uCombo;
  uniform int   uMode;
  uniform float uPerfectStart;
  const vec3 PURPLE = vec3(0.659, 0.333, 0.969);
  const vec3 PINK   = vec3(1.000, 0.416, 0.690);
  const vec3 GOLD   = vec3(1.000, 0.843, 0.000);
  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0; float a = 0.5;

  function init(audioCtx) {
    ctx = audioCtx;
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.12;

  }

    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, ctx.currentTime);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(ctx.currentTime + i * 0.02);
      osc.stop(ctx.currentTime + duration);
    });
  }

  function playArpeggio(notes, beatDur) {
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * beatDur / notes.length;
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + beatDur / notes.length * 0.8);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + beatDur / notes.length);

  }

    gain.gain.setValueAtTime(0.3, ctx.currentTime);
